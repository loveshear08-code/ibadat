<!DOCTYPE html>
<html lang="bn">

<head>

<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>IBADAT</title>

<link rel="stylesheet"
      href="css/home.css">

<link rel="manifest"
      href="manifest.json">

<meta name="theme-color"
      content="#0F5132">

</head>

<body>

<!-- ================= TOP BAR ================= -->

<header class="top-bar">

    <div id="city"
         class="top-city">
         ...
    </div>

    <div id="date"
         class="top-date">
         ...
    </div>

</header>


<!-- ================= MAIN ================= -->

<main class="main-container">


    <!-- ================= BISMILLAH ================= -->

    <section
        id="bismillahCard"
        class="card bismillah-card">

        <div class="bismillah-ar">

            بِسْمِ اللّٰهِ الرَّحْمٰنِ الرَّحِيْمِ

        </div>

        <div id="bismillahMeaning">

        </div>

    </section>



    <!-- ================= STATUS ================= -->

    <section
        class="card status-card">

        <div class="status">


            <!-- LEFT -->

            <div class="status-left">

                <div id="todayDay"></div>

                <div id="clock"></div>

                <div id="currentPrayerName"></div>

            </div>



            <!-- RIGHT -->

            <div class="status-right">

                <div id="weather"></div>

                <div id="countdown"></div>

                <div id="nextPrayerName"></div>

            </div>


        </div>

    </section>



    <!-- ================= PRAYER TIMES ================= -->

    <section
        class="card prayer-card">

        <div id="prayerGrid"
             class="prayer-grid">

        </div>

    </section>



    <!-- ================= FEATURES ================= -->

    <section
        class="feature-grid">


        <div id="namaz"
             class="feature-card">
        </div>


        <div id="quran"
             class="feature-card">
        </div>


        <div id="dua"
             class="feature-card">
        </div>


        <div id="hadith"
             class="feature-card">
        </div>


        <div id="qibla"
             class="feature-card">
        </div>


        <div id="tasbih"
             class="feature-card">
        </div>


    </section>


</main>



<!-- ================= BOTTOM BAR ================= -->

<footer class="bottom-bar">

    <div id="bottomText">

    </div>

</footer>



<!-- ================= SCRIPTS ================= -->

<script src="js/home.js?v=12"></script>

<script src="js/theme.js"></script>


<script>

if ("serviceWorker" in navigator) {

    navigator.serviceWorker.register(
        "service-worker.js"
    );
}

</script>

</body>
</html>
