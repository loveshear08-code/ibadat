<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#124C32">
  <title>IBADAT</title>
  <link rel="stylesheet" href="css/home.css">
</head>
<body>
  <div class="app-shell">

    <header class="top-board">
      <div class="location-area">
        <span class="location-symbol" aria-hidden="true">●</span>
        <span id="city">কলকাতা</span>
      </div>
      <div id="date" class="date-area">—</div>
    </header>

    <main class="home-content">

      <a class="home-board bismillah-board" href="html/allah-names.html"
        aria-label="আল্লাহর নাম">
        <div class="board-overlay"></div>
        <div class="bismillah-content">
          <div class="bismillah-decoration" aria-hidden="true">
            <span class="decoration-leaf decoration-left">❧</span>
            <span class="decoration-diamond">❖</span>
            <span class="decoration-leaf decoration-right">❧</span>
          </div>

          <div class="arabic-bismillah" lang="ar" dir="rtl">
            بِسْمِ اللَّهِ الرَّحْمَٰنِ الرَّحِيمِ
          </div>
          <p id="bismillahMeaning">পরম করুণাময় অসীম দয়ালু আল্লাহর নামে</p>
        </div>
      </a>

      <a class="home-board daily-board" href="html/calendar.html"
        aria-label="ক্যালেন্ডার">
        <div class="board-overlay"></div>

        <div class="daily-top">
          <div id="dayName" class="daily-day">রবিবার</div>
          <div class="weather-info">
            <span id="weatherIcon" class="weather-icon" aria-hidden="true">☀️</span>
            <span id="temperature">--</span>
            <span id="temperatureUnit">সে.</span>
          </div>
        </div>

        <div class="daily-middle">
          <div id="clock" class="clock-time">--:--:--</div>
          <div id="countdown" class="countdown-time">--:--:--</div>
        </div>

        <div class="daily-bottom">
          <div class="current-prayer">
            <span class="prayer-dot"></span>
            <span id="currentPrayer">ফজর</span>
          </div>
          <div class="next-prayer">
            <span class="next-arrow" aria-hidden="true">❯❯</span>
            <span id="nextPrayer">যোহর</span>
          </div>
        </div>
      </a>

      <section class="home-board prayer-board">
        <div class="board-overlay"></div>

        <div class="prayer-grid">
          <div class="prayer-cell">
            <span data-prayer-label="Fajr">ফজর</span>
            <strong id="fajrTime">--:--</strong>
          </div>

          <button class="prayer-cell sunrise-cell" id="sunriseSettings"
            type="button" aria-label="Settings">
            <span class="sunrise-label">
              <span data-prayer-label="Sunrise">সূর্যোদয়</span>
              <span class="settings-symbol" aria-hidden="true">⚙</span>
            </span>
            <strong id="sunriseTime">--:--</strong>
          </button>

          <div class="prayer-cell">
            <span data-prayer-label="Dhuhr">যোহর</span>
            <strong id="dhuhrTime">--:--</strong>
          </div>

          <div class="prayer-cell">
            <span data-prayer-label="Asr">আসর</span>
            <strong id="asrTime">--:--</strong>
          </div>

          <div class="prayer-cell">
            <span data-prayer-label="Maghrib">মাগরিব</span>
            <strong id="maghribTime">--:--</strong>
          </div>

          <div class="prayer-cell">
            <span data-prayer-label="Isha">ইশা</span>
            <strong id="ishaTime">--:--</strong>
          </div>
        </div>
      </section>

      <nav class="feature-grid" aria-label="Main menu">
        <a class="feature-card" href="html/namaz.html">
          <img src="assets/icon/namaz.png" alt="" class="feature-icon">
          <span data-feature-label="namaz">নামাজ</span>
        </a>

        <a class="feature-card" href="html/quran.html">
          <img src="assets/icon/quran.png" alt="" class="feature-icon">
          <span data-feature-label="quran">কুরআন</span>
        </a>

        <a class="feature-card" href="html/dua.html">
          <img src="assets/icon/dua.png" alt="" class="feature-icon">
          <span data-feature-label="dua">দোয়া</span>
        </a>

        <a class="feature-card" href="html/hadith.html">
          <img src="assets/icon/hadith.png" alt="" class="feature-icon">
          <span data-feature-label="hadith">হাদিস</span>
        </a>

        <a class="feature-card" href="html/qibla.html">
          <img src="assets/icon/qibla.png" alt="" class="feature-icon">
          <span data-feature-label="qibla">কিবলা</span>
        </a>

        <a class="feature-card" href="html/tasbih.html">
          <img src="assets/icon/tasbih.png" alt="" class="feature-icon">
          <span data-feature-label="tasbih">তাসবিহ</span>
        </a>
      </nav>

    </main>

    <footer class="footer-board">
      <span class="footer-icon" aria-hidden="true">📖</span>
      <p id="footerMessage">আল্লাহর স্মরণেই অন্তর প্রশান্ত হয়।</p>
    </footer>

  </div>

  <script src="js/theme.js"></script>
  <script src="js/home.js"></script>
</body>
</html>
