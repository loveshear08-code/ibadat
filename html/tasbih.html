<!DOCTYPE html>
<html lang="bn">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>তসবিহ</title>

<link rel="stylesheet"
      href="../css/tasbih.css">

</head>


<body>

<div class="tasbih-page">


    <!-- ================= HEADER ================= -->

    <div class="tasbih-header">

        <button id="backBtn"
                class="back-btn">

            ←

        </button>

        <div id="pageTitle"
             class="page-title">

            তসবিহ

        </div>

    </div>


    <!-- ================= TOP AREA ================= -->

    <div class="top-area">


        <!-- CURRENT ZIKR -->

        <div class="zikr-card">

            <div id="zikrLabel"
                 class="small-label">

                বর্তমান জিকির

            </div>

            <div id="zikrArabic"
                 class="zikr-arabic">

                سُبْحَانَ اللّٰهِ

            </div>

            <div id="zikrName"
                 class="zikr-name">

                সুবহানাল্লাহ

            </div>

            <div id="stepText"
                 class="step-text">

                ধাপ ১ / ৪

            </div>

        </div>


        <!-- COUNT INFORMATION -->

        <div class="count-info">


            <div class="count-card">

                <div id="stepCountLabel"
                     class="small-label">

                    বর্তমান ধাপ

                </div>

                <div id="stepCount"
                     class="step-count">

                    0 / 33

                </div>

            </div>


            <div class="count-card">

                <div id="totalCountLabel"
                     class="small-label">

                    মোট কাউন্ট

                </div>

                <div id="totalCount"
                     class="total-count">

                    0 / 100

                </div>

            </div>


        </div>


        <!-- PROGRESS -->

        <div class="progress-section">

            <div class="progress-text">

                <span id="progressLabel">
                    অগ্রগতি
                </span>

                <span id="progressPercent">
                    0%
                </span>

            </div>

            <div class="progress-bar">

                <div id="progressFill"
                     class="progress-fill">

                </div>

            </div>

        </div>


        <!-- TODAY COMPLETE -->

        <div class="today-card">

            <div id="todayLabel"
                 class="small-label">

                আজ সম্পূর্ণ

            </div>

            <div>

                <span id="todayComplete"
                      class="today-number">

                    0

                </span>

                <span id="todayTimes">

                    বার

                </span>

            </div>

        </div>


        <!-- MESSAGE -->

        <div id="completeMessage"
             class="complete-message">

        </div>


    </div>


    <!-- ================= TAP AREA ================= -->

    <div class="tap-area">


        <button id="tapButton"
                class="tap-button">

            <span class="tap-text"
                  id="tapText">

                TAP

            </span>

            <span class="tap-number"
                  id="tapNumber">

                0

            </span>

        </button>


        <button id="resetBtn"
                class="reset-button">

            ↺ <span id="resetText">রিসেট</span>

        </button>


    </div>


</div>


<script src="../js/tasbih.js?v=4"></script>

<script src="../js/theme.js"></script>


</body>

</html>
