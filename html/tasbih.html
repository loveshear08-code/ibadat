
<!DOCTYPE html>
<html lang="bn">

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <meta name="theme-color" content="#F8F6F0">

    <title>তসবিহ</title>

    <link rel="stylesheet" href="../css/tasbih.css">
</head>

<body>

<div class="tasbih-page">

    <!-- CURRENT ZIKR -->

    <div class="top-area">

        <div class="zikr-card">

            <div id="zikrLabel" class="small-label">
                বর্তমান জিকির
            </div>

            <div id="zikrArabic" class="zikr-arabic">
                سُبْحَانَ اللّٰهِ
            </div>

            <div id="zikrName" class="zikr-name">
                সুবহানাল্লাহ
            </div>

            <div id="stepText" class="step-text">
                ধাপ ১ / ৪
            </div>

        </div>

        <!-- COUNT -->

        <div class="count-info">

            <div class="count-card">

                <div id="stepCountLabel" class="small-label">
                    বর্তমান ধাপ
                </div>

                <div id="stepCount" class="step-count">
                    ০ / ৩৩
                </div>

            </div>

            <div class="count-card">

                <div id="totalCountLabel" class="small-label">
                    মোট কাউন্ট
                </div>

                <div id="totalCount" class="total-count">
                    ০ / ১০০
                </div>

            </div>

        </div>

        <!-- PROGRESS -->

        <div class="progress-section">

            <div class="progress-text">

                <span id="progressLabel">অগ্রগতি</span>

                <span id="progressPercent">০%</span>

            </div>

            <div class="progress-bar">

                <div id="progressFill" class="progress-fill"></div>

            </div>

        </div>

        <!-- DAILY TOTAL -->

        <div class="today-card">

            <div id="todayLabel" class="small-label">
                আজ মোট সম্পন্ন
            </div>

            <div class="today-value">

                <span id="todayComplete" class="today-number">
                    ০
                </span>

                <span id="todayTimes">বার</span>

            </div>

        </div>

        <!-- COMPLETION MESSAGE -->

        <div id="completeMessage" class="complete-message"></div>

    </div>

    <!-- TAP BUTTON -->

    <div class="tap-area">

        <button
            id="tapButton"
            class="tap-button"
            type="button"
            onclick="increase()">

            <img
    src="../assets/tasbih_touch.png"
    alt=""
    class="tap-icon">

        </button>

    </div>

</div>

<script src="../js/tasbih.js?v=5"></script>
<script src="../js/theme.js"></script>

</body>
</html>
