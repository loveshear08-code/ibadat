
<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    >

    <meta name="theme-color" content="#123d2c">

    <meta
        name="description"
        content="আল্লাহর ৯৯টি নাম, আরবি, উচ্চারণ ও অর্থসহ"
    >

    <title>আল্লাহর নামসমূহ | IBADAT</title>

    <link rel="stylesheet" href="../css/allah-names.css?v=3">
</head>

<body>

    <span id="pageTitle" hidden></span>

    <main class="names-page">

        <!-- FIXED TOP BOARD -->
        <header class="intro-board">
            <div class="intro-content">

                <div
                    class="intro-arabic"
                    lang="ar"
                    dir="rtl"
                >
                    أَسْمَاءُ اللَّهِ
                </div>

                <h1 class="intro-title" id="introTitle">
                    আল্লাহর নামসমূহ
                </h1>

                <div class="intro-divider" aria-hidden="true">
                    <span></span>
                    <span class="divider-ornament">❈</span>
                    <span></span>
                </div>

            </div>
        </header>

        <!-- FIXED MIDDLE BOARD; ONLY ITS CONTENT SCROLLS -->
        <section
            class="names-board"
            aria-label="আল্লাহর নামসমূহের তালিকা"
        >
            <div
                class="names-container"
                id="namesContainer"
                aria-label="বিসমিল্লাহ এবং আল্লাহর ৯৯টি নাম"
            >
                <!-- Bismillah and 99 names are rendered by JavaScript -->
            </div>
        </section>

        <!-- FIXED FOOTER BOARD -->
        <footer class="names-footer">
            <p id="namesFooterText">
                আল্লাহকে জানুন, স্মরণে রাখুন।
            </p>
        </footer>

    </main>

    <script src="../js/allah-names.js?v=3" defer></script>
    <script src="../js/theme.js" defer></script>

</body>
</html>
