<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#1B7F4B" id="themeColorMeta">

    <title>ক্যালেন্ডার | IBADAT</title>

    <link rel="stylesheet" href="../css/calendar.css?v=final7">
</head>
<body>

    <!-- হেডার বোর্ড -->
    <header class="top-board">
        <button
            id="prevMonth"
            class="month-button"
            type="button"
            aria-label="Previous month"
            title="Previous month">
            <span aria-hidden="true">◀</span>
        </button>

        <h1 id="calendarHeading">ক্যালেন্ডার</h1>

        <button
            id="nextMonth"
            class="month-button"
            type="button"
            aria-label="Next month"
            title="Next month">
            <span aria-hidden="true">▶</span>
        </button>
    </header>

    <!-- মূল কনটেন্ট -->
    <main class="calendar">

        <!-- মাসের ক্যালেন্ডার বোর্ড -->
        <section class="calendar-board" aria-label="Calendar">

            <h2 id="monthTitle"></h2>

            <div
                class="day-names"
                id="dayNames">
            </div>

            <div
                id="calendarGrid"
                class="grid">
            </div>

        </section>

        <!-- ইসলামিক বিশেষ দিনের বোর্ড -->
        <section
            class="events-section"
            aria-label="Islamic special days">

            <h2
                class="events-title"
                id="eventsTitle">
            </h2>

            <div
                class="events-timeline"
                id="eventsTimeline"
                aria-live="polite">
            </div>

        </section>

    </main>

    <!-- ফুটার বোর্ড -->
    <footer class="bottom-board">
        <p id="calendarFooter">আল্লাহকে স্মরণ করুন</p>
    </footer>

    <!-- ক্যালেন্ডারের JavaScript -->
    <script src="../js/calendar.js?v=final7"></script>

    <!-- বিদ্যমান থিম সিস্টেম -->
    <script src="../js/theme.js"></script>

</body>
</html>
