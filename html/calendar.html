<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#1F6B3A">

<title>Calendar</title>

<link rel="stylesheet" href="../css/calendar.css?v=final3">
</head>

<body>

<div class="calendar">

    <!-- HEADER -->
    <div class="header">
        <button id="prevMonth" type="button" aria-label="Previous month">◀</button>
        <h2 id="monthTitle"></h2>
        <button id="nextMonth" type="button" aria-label="Next month">▶</button>
    </div>

    <!-- DAYS -->
    <div class="day-names" id="dayNames"></div>

    <!-- GRID -->
    <div id="calendarGrid" class="grid"></div>

    <!-- ISLAMIC EVENTS -->
    <section class="events-section">
        <div class="events-title" id="eventsTitle"></div>
        <div class="events-timeline" id="eventsTimeline" aria-live="polite"></div>
    </section>

</div>

<script src="../js/calendar.js?v=final3"></script>
<script src="../js/theme.js"></script>

</body>
</html>
