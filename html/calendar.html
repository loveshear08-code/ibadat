<!DOCTYPE html>
<html lang="bn">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#1F6B3A">

    <title>Calendar</title>

    <!-- Calendar CSS -->
    <link rel="stylesheet" href="../css/calendar.css?v=final5">
</head>

<body>

    <!-- FIXED TOP BOARD -->
    <header class="top-board">

        <!-- PREVIOUS MONTH -->
        <button
            id="prevMonth"
            class="month-button"
            type="button"
            aria-label="Previous month"
            title="Previous month">
            <span aria-hidden="true">◀</span>
        </button>

        <!-- CENTER HEADING -->
        <h1 id="calendarHeading">ক্যালেন্ডার</h1>

        <!-- NEXT MONTH -->
        <button
            id="nextMonth"
            class="month-button"
            type="button"
            aria-label="Next month"
            title="Next month">
            <span aria-hidden="true">▶</span>
        </button>

    </header>

    <!-- MAIN CALENDAR CONTENT -->
    <main class="calendar">

        <!-- CALENDAR BOARD -->
        <section
            class="calendar-board"
            aria-label="Calendar">

            <!-- MONTH AND YEAR -->
            <h2 id="monthTitle"></h2>

            <!-- WEEKDAY NAMES -->
            <div
                class="day-names"
                id="dayNames">
            </div>

            <!-- CALENDAR DATE GRID -->
            <div
                id="calendarGrid"
                class="grid">
            </div>

        </section>

        <!-- ISLAMIC SPECIAL DAYS BOARD -->
        <section
            class="events-section"
            aria-label="Islamic special days">

            <h2
                class="events-title"
                id="eventsTitle">
            </h2>

            <div
                class="events-timeline"
                id="eventsTimeline"
                aria-live="polite">
            </div>

        </section>

    </main>

    <!-- FIXED BOTTOM FOOTER BOARD -->
    <footer class="bottom-board">

        <p id="calendarFooter">
            আল্লাহকে স্মরণ করুন
        </p>

    </footer>

    <!-- Calendar JavaScript -->
    <script src="../js/calendar.js?v=final5"></script>

    <!-- Existing Theme JavaScript -->
    <script src="../js/theme.js"></script>

</body>
</html>
