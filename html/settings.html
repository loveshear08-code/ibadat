 <!DOCTYPE html>
<html lang="bn">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Settings</title>

<link rel="stylesheet" href="../css/settings.css">

</head>

<body>

<div class="container">

    <!-- TITLE -->

    <h2 id="settingsTitle">⚙️ সেটিংস</h2>


    <div class="content">

        <!-- ================= AZAN ================= -->

        <div class="card">

            <h3 id="azanTitle">
                আজান সেটিং
            </h3>

            <p id="azanDesc">
                কোন ওয়াক্তে কোন আজান বাজবে
            </p>


            <!-- FAJR -->

            <div class="azan-row">

                <span id="prayer_fajr">
                    ফজর
                </span>

                <select id="azan_fajr"></select>

                <button
                    onclick="playAzan(
                        document.getElementById('azan_fajr').value
                    )">
                    ▶️
                </button>

            </div>


            <!-- DHUHR -->

            <div class="azan-row">

                <span id="prayer_dhuhr">
                    জোহর
                </span>

                <select id="azan_dhuhr"></select>

                <button
                    onclick="playAzan(
                        document.getElementById('azan_dhuhr').value
                    )">
                    ▶️
                </button>

            </div>


            <!-- ASR -->

            <div class="azan-row">

                <span id="prayer_asr">
                    আসর
                </span>

                <select id="azan_asr"></select>

                <button
                    onclick="playAzan(
                        document.getElementById('azan_asr').value
                    )">
                    ▶️
                </button>

            </div>


            <!-- MAGHRIB -->

            <div class="azan-row">

                <span id="prayer_maghrib">
                    মাগরিব
                </span>

                <select id="azan_maghrib"></select>

                <button
                    onclick="playAzan(
                        document.getElementById('azan_maghrib').value
                    )">
                    ▶️
                </button>

            </div>


            <!-- ISHA -->

            <div class="azan-row">

                <span id="prayer_isha">
                    এশা
                </span>

                <select id="azan_isha"></select>

                <button
                    onclick="playAzan(
                        document.getElementById('azan_isha').value
                    )">
                    ▶️
                </button>

            </div>

        </div>


        <!-- ================= LANGUAGE ================= -->

        <div class="card">

            <h3 id="langTitle">
                ভাষা
            </h3>

            <select id="langSelect">

                <option value="bn">
                    বাংলা
                </option>

                <option value="en">
                    English
                </option>

                <option value="hi">
                    हिन्दी
                </option>

            </select>

        </div>


        <!-- ================= THEME ================= -->

        <div class="card">

            <h3 id="themeTitle">
                থিম
            </h3>

            <label>

                <input
                    type="checkbox"
                    id="darkMode">

                <span id="darkLabel">
                    ডার্ক মোড
                </span>

            </label>

        </div>

    </div>


    <!-- ================= SAVE ================= -->

    <div class="btn-box">

        <button
            id="saveBtn"
            onclick="saveSettings()">

            সেভ

        </button>

    </div>

</div>


<script src="../js/settings.js?v=20"></script>

</body>
</html>
