
<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#124C32">
    <title>Settings</title>
    <link rel="stylesheet" href="../css/settings.css?v=23">
</head>
<body>

    <!-- MAIN BOARD: DESIGN UNCHANGED -->
    <header class="top-board">
        <h1 id="settingsTitle">সেটিংস</h1>
    </header>

    <main class="container">
        <div class="content">

            <!-- LANGUAGE SETTINGS -->
            <section class="card language-card">
                <h2 id="langTitle">ভাষা</h2>

                <select id="langSelect" aria-label="Language">
                    <option value="en">English</option>
                    <option value="bn">বাংলা</option>
                    <option value="hi">हिन्दी</option>
                </select>
            </section>

            <!-- LIGHT / DARK MODE -->
            <section class="card theme-card">
                <h2 id="themeTitle">থিম</h2>

                <label for="darkMode" class="theme-label">
                    <input type="checkbox" id="darkMode">
                    <span id="darkLabel">ডার্ক মোড</span>
                </label>
            </section>

            <!-- NEW THEME COLOR SETTINGS -->
            <section class="card theme-color-card">
                <h2 id="themeColorTitle">থিম কালার</h2>
                <p id="themeColorDesc">আপনার পছন্দের রঙ নির্বাচন করুন</p>

                <div
                    class="theme-options"
                    id="themeOptions"
                    role="radiogroup"
                    aria-labelledby="themeColorTitle"
                >

                    <button
                        type="button"
                        class="theme-option"
                        data-theme="classic"
                        role="radio"
                        aria-checked="true"
                    >
                        <span class="theme-swatches" aria-hidden="true">
                            <span style="--swatch:#1B7F4B"></span>
                            <span style="--swatch:#E8F5E9"></span>
                            <span style="--swatch:#F2C94C"></span>
                            <span style="--swatch:#0F5132"></span>
                        </span>
                        <span class="theme-option-name" data-theme-name="classic">
                            Classic Green
                        </span>
                        <span class="theme-check" aria-hidden="true">✓</span>
                    </button>

                    <button
                        type="button"
                        class="theme-option"
                        data-theme="royal"
                        role="radio"
                        aria-checked="false"
                    >
                        <span class="theme-swatches" aria-hidden="true">
                            <span style="--swatch:#285A8E"></span>
                            <span style="--swatch:#E5EFF9"></span>
                            <span style="--swatch:#E8BD55"></span>
                            <span style="--swatch:#173A60"></span>
                        </span>
                        <span class="theme-option-name" data-theme-name="royal">
                            Royal Blue
                        </span>
                        <span class="theme-check" aria-hidden="true">✓</span>
                    </button>

                    <button
                        type="button"
                        class="theme-option"
                        data-theme="rose"
                        role="radio"
                        aria-checked="false"
                    >
                        <span class="theme-swatches" aria-hidden="true">
                            <span style="--swatch:#B96F79"></span>
                            <span style="--swatch:#F8E9E7"></span>
                            <span style="--swatch:#D9B875"></span>
                            <span style="--swatch:#7D414B"></span>
                        </span>
                        <span class="theme-option-name" data-theme-name="rose">
                            Rose Champagne
                        </span>
                        <span class="theme-check" aria-hidden="true">✓</span>
                    </button>

                    <button
                        type="button"
                        class="theme-option"
                        data-theme="pista"
                        role="radio"
                        aria-checked="false"
                    >
                        <span class="theme-swatches" aria-hidden="true">
                            <span style="--swatch:#4CAF50"></span>
                            <span style="--swatch:#DFF5E1"></span>
                            <span style="--swatch:#A7D129"></span>
                            <span style="--swatch:#FFFFFF"></span>
                        </span>
                        <span class="theme-option-name" data-theme-name="pista">
                            Fresh Pista
                        </span>
                        <span class="theme-check" aria-hidden="true">✓</span>
                    </button>

                </div>
            </section>

            <!-- AZAN SETTINGS -->
            <section class="card azan-card">
                <h2 id="azanTitle">আজান সেটিং</h2>
                <p id="azanDesc">কোন ওয়াক্তে কোন আজান বাজবে</p>

                <div class="azan-list">

                    <div class="azan-row">
                        <span id="prayer_fajr">ফজর</span>
                        <select id="azan_fajr" aria-label="Fajr Azan"></select>
                        <button type="button" class="play-button"
                            aria-label="Play Fajr Azan"
                            onclick="playAzan(document.getElementById('azan_fajr').value)">▶</button>
                    </div>

                    <div class="azan-row">
                        <span id="prayer_dhuhr">জোহর</span>
                        <select id="azan_dhuhr" aria-label="Dhuhr Azan"></select>
                        <button type="button" class="play-button"
                            aria-label="Play Dhuhr Azan"
                            onclick="playAzan(document.getElementById('azan_dhuhr').value)">▶</button>
                    </div>

                    <div class="azan-row">
                        <span id="prayer_asr">আসর</span>
                        <select id="azan_asr" aria-label="Asr Azan"></select>
                        <button type="button" class="play-button"
                            aria-label="Play Asr Azan"
                            onclick="playAzan(document.getElementById('azan_asr').value)">▶</button>
                    </div>

                    <div class="azan-row">
                        <span id="prayer_maghrib">মাগরিব</span>
                        <select id="azan_maghrib" aria-label="Maghrib Azan"></select>
                        <button type="button" class="play-button"
                            aria-label="Play Maghrib Azan"
                            onclick="playAzan(document.getElementById('azan_maghrib').value)">▶</button>
                    </div>

                    <div class="azan-row">
                        <span id="prayer_isha">এশা</span>
                        <select id="azan_isha" aria-label="Isha Azan"></select>
                        <button type="button" class="play-button"
                            aria-label="Play Isha Azan"
                            onclick="playAzan(document.getElementById('azan_isha').value)">▶</button>
                    </div>

                </div>
            </section>

        </div>

        <div class="btn-box">
            <button type="button" id="saveBtn" onclick="saveSettings()">
                সেভ
            </button>
        </div>
    </main>

    <!-- FOOTER BOARD: DESIGN UNCHANGED -->
    <footer class="bottom-board">
        <p id="settingsFooter">আল্লাহকে স্মরণ করুন</p>
    </footer>

    <script src="../js/settings.js?v=23"></script>
    <script src="../js/theme.js"></script>
</body>
</html>
