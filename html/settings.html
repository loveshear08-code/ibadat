<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#124C32">
    <title>Settings | IBADAT</title>
    <link rel="stylesheet" href="../css/settings.css?v=25">
</head>
<body>

    <header class="top-board">
        <h1 id="settingsTitle">সেটিংস</h1>
    </header>

    <main class="container">
        <div class="content">

            <!-- 1. LANGUAGE -->
            <section class="card language-card">
                <h2 id="langTitle">ভাষা</h2>
                <select id="langSelect" aria-label="Language">
                    <option value="bn">বাংলা</option>
                    <option value="en">English</option>
                    <option value="hi">हिन्दी</option>
                </select>
            </section>

            <!-- 2. SINGLE THEME BOARD -->
            <section class="card theme-card">

                <div class="theme-heading-row">
                    <h2 id="themeTitle">থিম</h2>

                    <label for="darkMode" class="dark-mode-control">
                        <span id="darkLabel">ডার্ক মোড</span>
                        <input type="checkbox" id="darkMode">
                        <span class="dark-check" aria-hidden="true">✓</span>
                    </label>
                </div>

                <div class="theme-color-section">
                    <p id="themeColorDesc">আপনার পছন্দের রঙ নির্বাচন করুন</p>

                    <div class="theme-options" id="themeOptions"
                         role="radiogroup" aria-label="Theme color">

                        <button type="button"
                                class="theme-option"
                                data-theme="classic"
                                role="radio"
                                aria-checked="true"
                                aria-label="Classic Green">
                            <span class="theme-dot" aria-hidden="true">
                                <span class="theme-check">✓</span>
                            </span>
                            <span class="theme-option-name" data-theme-name="classic">ক্লাসিক সবুজ</span>
                        </button>

                        <button type="button"
                                class="theme-option"
                                data-theme="royal"
                                role="radio"
                                aria-checked="false"
                                aria-label="Royal Blue">
                            <span class="theme-dot" aria-hidden="true">
                                <span class="theme-check">✓</span>
                            </span>
                            <span class="theme-option-name" data-theme-name="royal">রয়্যাল নীল</span>
                        </button>

                        <button type="button"
                                class="theme-option"
                                data-theme="rose"
                                role="radio"
                                aria-checked="false"
                                aria-label="Rose Champagne">
                            <span class="theme-dot" aria-hidden="true">
                                <span class="theme-check">✓</span>
                            </span>
                            <span class="theme-option-name" data-theme-name="rose">রোজ ও শ্যাম্পেন</span>
                        </button>

                        <button type="button"
                                class="theme-option"
                                data-theme="pista"
                                role="radio"
                                aria-checked="false"
                                aria-label="Fresh Pista">
                            <span class="theme-dot" aria-hidden="true">
                                <span class="theme-check">✓</span>
                            </span>
                            <span class="theme-option-name" data-theme-name="pista">ফ্রেশ পিস্তা</span>
                        </button>

                    </div>
                </div>
            </section>

            <!-- 3. AZAN -->
            <section class="card azan-card">
                <h2 id="azanTitle">আযান</h2>
                <p id="azanDesc">কোন ওয়াক্তে কোন আজান বাজবে</p>

                <div class="azan-list">

                    <div class="azan-row">
                        <span id="prayer_fajr">ফজর</span>
                        <select id="azan_fajr" aria-label="Fajr Azan"></select>
                        <button type="button" class="play-button"
                                data-prayer="fajr" aria-label="Play Fajr Azan">▶</button>
                    </div>

                    <div class="azan-row">
                        <span id="prayer_dhuhr">জোহর</span>
                        <select id="azan_dhuhr" aria-label="Dhuhr Azan"></select>
                        <button type="button" class="play-button"
                                data-prayer="dhuhr" aria-label="Play Dhuhr Azan">▶</button>
                    </div>

                    <div class="azan-row">
                        <span id="prayer_asr">আসর</span>
                        <select id="azan_asr" aria-label="Asr Azan"></select>
                        <button type="button" class="play-button"
                                data-prayer="asr" aria-label="Play Asr Azan">▶</button>
                    </div>

                    <div class="azan-row">
                        <span id="prayer_maghrib">মাগরিব</span>
                        <select id="azan_maghrib" aria-label="Maghrib Azan"></select>
                        <button type="button" class="play-button"
                                data-prayer="maghrib" aria-label="Play Maghrib Azan">▶</button>
                    </div>

                    <div class="azan-row">
                        <span id="prayer_isha">এশা</span>
                        <select id="azan_isha" aria-label="Isha Azan"></select>
                        <button type="button" class="play-button"
                                data-prayer="isha" aria-label="Play Isha Azan">▶</button>
                    </div>

                </div>
            </section>

        </div>

        <!-- FULL-WIDTH SAVE BOARD -->
        <div class="btn-box">
            <button type="button" id="saveBtn">সংরক্ষণ</button>
        </div>

    </main>

    <footer class="bottom-board">
        <p id="settingsFooter">আল্লাহকে স্মরণ করুন</p>
    </footer>

    <script src="../js/settings.js?v=25"></script>
</body>
</html>
