
<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#123d2c">
  <title>IBADAT | আল-কুরআন</title>
  <link rel="stylesheet" href="../css/quran.css">
</head>

<body>
  <div class="app" id="quranApp">

    <!-- Shared Header -->
    <header class="hero board">
      <div class="hero-content">
        <h1 class="hero-title" id="pageSubtitle" dir="rtl" lang="ar">
          بِسْمِ اللَّهِ الرَّحْمَٰنِ الرَّحِيمِ
        </h1>
        <p class="hero-subtitle" id="heroSubtitle">
          পরম করুণাময়, অসীম দয়ালু আল্লাহর নামে
        </p>
      </div>
    </header>

    <main class="page-container">

      <!-- Quran Home Page -->
      <section class="page home-page active" id="homePage">

        <div class="featured board">
          <div class="featured-content">

            <div class="quran-image-wrap">
              <img
                class="quran-image"
                id="quranImage"
                src="../assets/images/quran.png"
                alt="আল-কুরআন"
              >
            </div>

            <h2 class="quran-title" id="quranTitle">
              আল-কুরআন
            </h2>

            <p class="quran-description" id="quranDescription">
              পবিত্র কুরআন পড়ুন, শুনুন এবং প্রশান্তি অনুভব করুন।
            </p>

          </div>
        </div>

        <!-- Home Options -->
        <nav class="home-options" aria-label="কুরআনের বিকল্প">

          <button
            class="option board"
            id="openRead"
            type="button"
          >
            <span class="option-icon" aria-hidden="true">📖</span>
            <span class="option-text" id="readOptionText">
              কুরআন পড়ুন
            </span>
          </button>

          <button
            class="option board"
            id="openListen"
            type="button"
          >
            <span class="option-icon" aria-hidden="true">🎧</span>
            <span class="option-text" id="listenOptionText">
              তিলাওয়াত শুনুন
            </span>
          </button>

        </nav>
      </section>

      <!-- Quran Reading Page -->
      <section class="page read-page" id="readPage" hidden>

        <div class="content-board board">

          <!-- Compact Toolbar: Search Left, Font Controls Right -->
          <div class="content-toolbar">

            <button
              class="toolbar-button search-toggle"
              id="searchToggle"
              type="button"
              aria-label="সূরা খুঁজুন"
              aria-expanded="false"
              aria-controls="surahSearchPanel"
              title="Search"
            >
              <span aria-hidden="true">⌕</span>
            </button>

            <div class="font-controls">

              <button
                class="toolbar-button"
                id="fontDown"
                type="button"
                aria-label="আরবি লেখা ছোট করুন"
                title="A−"
              >A−</button>

              <button
                class="toolbar-button"
                id="fontUp"
                type="button"
                aria-label="আরবি লেখা বড় করুন"
                title="A+"
              >A+</button>

            </div>
          </div>

          <!-- Surah Search Panel -->
          <div
            class="surah-search-panel"
            id="surahSearchPanel"
            hidden
          >
            <h2
              class="surah-search-heading"
              id="surahSearchHeading"
            >
              সূরা খুঁজুন
            </h2>

            <input
              class="surah-search-input"
              id="surahSearchInput"
              type="search"
              placeholder="সূরার নাম লিখুন..."
              autocomplete="off"
              aria-label="সূরা খুঁজুন"
            >

            <div class="surah-search-list" id="surahSearchList">
              <div class="surah-list" id="surahList"></div>
            </div>
          </div>

          <!-- Only the content inside this area will scroll -->
          <div class="read-content" id="readContent">
            <p class="loading-message" id="readLoading">
              কুরআনের আয়াত লোড হচ্ছে...
            </p>
          </div>

        </div>
      </section>

      <!-- Quran Listening Page -->
      <section class="page listen-page" id="listenPage" hidden>

        <div class="content-board board">

          <!-- No toolbar on the listening page -->
          <div class="listen-surah-list" id="listenSurahList">
            <p class="loading-message" id="listenLoading">
              সূরার তালিকা লোড হচ্ছে...
            </p>
          </div>

        </div>
      </section>

    </main>

    <!-- Shared Fixed Footer -->
    <footer class="footer board">

      <!-- Home Footer -->
      <div class="footer-content footer-home" id="homeFooter">
        <p class="footer-text" id="footerText">
          আল-কুরআন — হেদায়েত ও প্রশান্তির আলো
        </p>
      </div>

      <!-- Reading Footer -->
      <div class="footer-content footer-read" id="readFooter" hidden>

        <button
          class="footer-control"
          id="prevAyah"
          type="button"
          aria-label="আগের সূরা"
          title="Previous Surah"
        >
          <span aria-hidden="true">‹</span>
        </button>

        <p class="footer-message" id="readFooterMessage">
          কুরআন পড়ুন, প্রশান্তি অনুভব করুন
        </p>

        <button
          class="footer-control"
          id="nextAyah"
          type="button"
          aria-label="পরের সূরা"
          title="Next Surah"
        >
          <span aria-hidden="true">›</span>
        </button>

      </div>

      <!-- Listening Footer -->
      <div class="footer-content footer-listen" id="listenFooter" hidden>

        <button
          class="footer-control"
          id="prevTrack"
          type="button"
          aria-label="আগের সূরা"
          title="Previous Surah"
        >
          <span aria-hidden="true">⏮</span>
        </button>

        <button
          class="footer-control play-pause"
          id="playPause"
          type="button"
          aria-label="তিলাওয়াত চালান"
          title="Play / Pause"
        >
          <span aria-hidden="true">▶</span>
        </button>

        <button
          class="footer-control"
          id="nextTrack"
          type="button"
          aria-label="পরের সূরা"
          title="Next Surah"
        >
          <span aria-hidden="true">⏭</span>
        </button>

      </div>

    </footer>

    <!-- Quran Audio Player -->
    <audio id="quranAudio" preload="none"></audio>

    <!-- Optional Status Message -->
    <div
      class="app-message"
      id="appMessage"
      role="status"
      aria-live="polite"
      hidden
    ></div>

  </div>

  <script src="../js/quran.js"></script>
</body>
</html>
