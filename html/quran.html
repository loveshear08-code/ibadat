
<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, viewport-fit=cover"
  >
  <meta name="theme-color" content="#104c32">

  <title>আল-কুরআন | IBADAT</title>

  <!-- CSS: HTML ফোল্ডার থেকে এক ধাপ উপরে CSS ফোল্ডারে -->
  <link rel="stylesheet" href="../css/quran.css">

  <!-- JavaScript: HTML ফোল্ডার থেকে এক ধাপ উপরে JS ফোল্ডারে -->
  <script src="../js/quran.js" defer></script>
</head>

<body>
  <main id="quranApp" class="app">

    <!-- HERO BOARD -->
    <header class="hero board">
      <div class="hero-content">
        <p
          class="hero-subtitle"
          data-i18n="subtitle"
        >শুদ্ধতার পথে শেখা ও অনুশীলন</p>

        <h1 id="pageTitle">আল-কুরআন</h1>
      </div>
    </header>

    <!-- HOME PAGE -->
    <section id="homePage" class="page home-page">

      <article class="featured board">
        <div class="featured-content">

          <p class="bismillah" lang="ar" dir="rtl">
            بِسْمِ اللَّهِ الرَّحْمَٰنِ الرَّحِيمِ
          </p>

          <div class="gold-divider"></div>

          <p
            class="meaning"
            data-i18n="bismillahMeaning"
          >পরম করুণাময়, অসীম দয়ালু আল্লাহর নামে।</p>

          <p
            class="reference"
            data-i18n="bismillahReference"
          >পবিত্র কুরআন</p>

        </div>
      </article>

      <!-- HOME OPTIONS -->
      <nav class="home-options" aria-label="কুরআন বিভাগ">

        <button
          id="openRead"
          class="option board"
          type="button"
        >
          <span data-i18n="readQuran">কুরআন পড়ুন</span>
        </button>

        <button
          id="openListen"
          class="option board"
          type="button"
        >
          <span data-i18n="listenQuran">তিলাওয়াত শুনুন</span>
        </button>

      </nav>
    </section>

    <!-- QURAN READING PAGE -->
    <section
      id="readPage"
      class="page read-page"
      hidden
    >
      <article class="content-board board">

        <div class="content-toolbar">
          <button
            id="fontDown"
            class="font-control"
            type="button"
            aria-label="কন্টেন্টের অক্ষর ছোট করুন"
          >A−</button>

          <button
            id="fontUp"
            class="font-control"
            type="button"
            aria-label="কন্টেন্টের অক্ষর বড় করুন"
          >A+</button>
        </div>

        <div
          id="readContent"
          class="read-content"
          aria-live="polite"
        >
          <p class="status" data-i18n="loading">
            লোড হচ্ছে...
          </p>
        </div>

      </article>
    </section>

    <!-- QURAN LISTENING PAGE -->
    <section
      id="listenPage"
      class="page listen-page"
      hidden
    >
      <article class="content-board board">

        <div
          id="surahList"
          class="surah-list"
          aria-live="polite"
        >
          <p class="status" data-i18n="loading">
            লোড হচ্ছে...
          </p>
        </div>

      </article>
    </section>

    <!-- SHARED FOOTER BOARD -->
    <footer id="appFooter" class="footer board">

      <!-- HOME FOOTER -->
      <div id="homeFooter" class="footer-home">
        <p data-i18n="footerText">
          ইবাদত • শুদ্ধতার পথে শেখা ও অনুশীলন
        </p>
      </div>

      <!-- READING FOOTER -->
      <div
        id="readFooter"
        class="footer-controls read-footer"
        hidden
      >
        <button
          id="prevAyah"
          class="media-control"
          type="button"
          aria-label="আগের আয়াত"
        >|◀</button>

        <p
          id="readFooterMessage"
          class="footer-message"
        >আল-কুরআন</p>

        <button
          id="nextAyah"
          class="media-control"
          type="button"
          aria-label="পরের আয়াত"
        >▶|</button>
      </div>

      <!-- LISTENING FOOTER -->
      <div
        id="listenFooter"
        class="footer-controls listen-footer"
        hidden
      >
        <button
          id="prevTrack"
          class="media-control"
          type="button"
          aria-label="আগের আয়াত"
        >|◀</button>

        <button
          id="playPause"
          class="play-control"
          type="button"
          aria-label="তিলাওয়াত চালু করুন"
        >▶</button>

        <button
          id="nextTrack"
          class="media-control"
          type="button"
          aria-label="পরের আয়াত"
        >▶|</button>
      </div>

    </footer>

    <!-- AUDIO PLAYER -->
    <audio id="quranAudio" preload="none"></audio>

  </main>
</body>
</html>
