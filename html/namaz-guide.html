<!DOCTYPE html><html lang="bn"><head><meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>IBADAT - নামাজ</title>

<link
    rel="stylesheet"
    href="../css/namaz-guide.css"
>

</head><body><header class="top-bar"><button id="backButton">←</button>

<span id="pageTitle"></span>

<span class="top-space"></span>

</header><main class="main"><!-- =================================================
     FIRST PAGE
     ================================================= -->

<section id="mainMenu">


    <!-- ================= KI O KENO ================= -->

    <div
        class="namaz-info-card"
        id="namazInfoCard"
    >

        <div class="info-icon">
            🕌
        </div>


        <div
            class="info-title"
            id="infoTitle"
        ></div>


        <div
            class="info-text"
            id="infoText1"
        ></div>


        <div
            class="info-text"
            id="infoText2"
        ></div>


        <!-- DAILY PRAYER SCHEDULE INSIDE SAME BOARD -->

        <div class="daily-section">

            <div
                id="dailyPrayerList"
                class="daily-prayer-list"
            ></div>

        </div>

    </div>



    <!-- =================================================
         FOUR MAIN OPTIONS
         ================================================= -->

    <div class="guide-grid">


        <!-- 1. PURITY -->

        <div
            class="guide-card"
            data-section="purity"
        >

            <div class="guide-icon">
                🧼
            </div>

            <div
                class="guide-title"
                id="titlePurity"
            ></div>

            <div
                class="guide-desc"
                id="descPurity"
            ></div>

        </div>



        <!-- 2. LEARN SALAH -->

        <div
            class="guide-card"
            data-section="learn"
        >

            <div class="guide-icon">
                📖
            </div>

            <div
                class="guide-title"
                id="titleLearn"
            ></div>

            <div
                class="guide-desc"
                id="descLearn"
            ></div>

        </div>



        <!-- 3. RECITATIONS -->

        <div
            class="guide-card"
            data-section="recitations"
        >

            <div class="guide-icon">
                🤲
            </div>

            <div
                class="guide-title"
                id="titleRecitations"
            ></div>

            <div
                class="guide-desc"
                id="descRecitations"
            ></div>

        </div>



        <!-- 4. JAMAAT & SPECIAL -->

        <div
            class="guide-card"
            data-section="jamaat"
        >

            <div class="guide-icon">
                👥
            </div>

            <div
                class="guide-title"
                id="titleJamaat"
            ></div>

            <div
                class="guide-desc"
                id="descJamaat"
            ></div>

        </div>


    </div>

</section>



<!-- =================================================
     BLANK SECTION PAGE
     ================================================= -->

<section
    id="sectionPage"
    class="inner-page hidden"
>

    <div class="section-header">

        <button id="sectionBackButton">
            ←
        </button>

        <span id="sectionTitle"></span>

    </div>


    <!-- INTENTIONALLY EMPTY -->

    <div id="sectionContent"></div>

</section>

</main><script src="../js/namaz-guide.js?v=15"></script>

</body>

</html>
