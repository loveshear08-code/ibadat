<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>IBADAT - Namaz Guide</title>

<link rel="stylesheet" href="../css/namaz-guide.css">
</head>

<body>

<div class="top-bar">
    <button id="backButton">←</button>
    <span id="pageTitle"></span>
    <span class="top-space"></span>
</div>

<div class="main">

    <div class="intro-card">
        <div id="introTitle"></div>
        <div id="introText"></div>
    </div>

    <div class="guide-grid">

        <!-- 1 -->
        <div class="guide-card" data-page="wudu">
            <div class="guide-icon">🧼</div>
            <div class="guide-title" id="titleWudu"></div>
            <div class="guide-desc" id="descWudu"></div>
        </div>

        <!-- 2 -->
        <div class="guide-card" data-page="what">
            <div class="guide-icon">🕌</div>
            <div class="guide-title" id="titleWhat"></div>
            <div class="guide-desc" id="descWhat"></div>
        </div>

        <!-- 3 -->
        <div class="guide-card" data-page="preparation">
            <div class="guide-icon">📋</div>
            <div class="guide-title" id="titlePreparation"></div>
            <div class="guide-desc" id="descPreparation"></div>
        </div>

        <!-- 4 -->
        <div class="guide-card" data-page="times">
            <div class="guide-icon">🕰️</div>
            <div class="guide-title" id="titleTimes"></div>
            <div class="guide-desc" id="descTimes"></div>
        </div>

        <!-- 5 -->
        <div class="guide-card" data-page="learn">
            <div class="guide-icon">📖</div>
            <div class="guide-title" id="titleLearn"></div>
            <div class="guide-desc" id="descLearn"></div>
        </div>

        <!-- 6 -->
        <div class="guide-card" data-page="duas">
            <div class="guide-icon">🤲</div>
            <div class="guide-title" id="titleDuas"></div>
            <div class="guide-desc" id="descDuas"></div>
        </div>

        <!-- 7 -->
        <div class="guide-card" data-page="jamaat">
            <div class="guide-icon">👥</div>
            <div class="guide-title" id="titleJamaat"></div>
            <div class="guide-desc" id="descJamaat"></div>
        </div>

        <!-- 8 -->
        <div class="guide-card" data-page="special">
            <div class="guide-icon">🌙</div>
            <div class="guide-title" id="titleSpecial"></div>
            <div class="guide-desc" id="descSpecial"></div>
        </div>

    </div>

</div>

<script src="../js/namaz-guide.js?v=2"></script>

</body>
</html>
