<!DOCTYPE html>
<html lang="bn">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>IBADAT - পবিত্রতা ও প্রস্তুতি</title>

    <link rel="stylesheet" href="../css/pobitrota-prostuti.css">
</head>

<body>

<header class="top-bar">

    <button id="backButton">←</button>

    <span id="pageTitle"></span>

    <span class="top-space"></span>

</header>


<main class="main">

    <section id="mainPage">

        <div class="section-intro">

            <div class="intro-icon">🧼</div>

            <div
                class="intro-title"
                id="introTitle">
            </div>

            <div
                class="intro-text"
                id="introText">
            </div>

        </div>


        <div class="topic-grid">

            <!-- 1 -->
            <div
                class="topic-card"
                data-topic="wudu">

                <div class="topic-icon">💧</div>

                <div
                    class="topic-title"
                    id="topicWudu">
                </div>

            </div>


            <!-- 2 -->
            <div
                class="topic-card"
                data-topic="ghusl">

                <div class="topic-icon">🚿</div>

                <div
                    class="topic-title"
                    id="topicGhusl">
                </div>

            </div>


            <!-- 3 -->
            <div
                class="topic-card"
                data-topic="tayammum">

                <div class="topic-icon">🤲</div>

                <div
                    class="topic-title"
                    id="topicTayammum">
                </div>

            </div>


            <!-- 4 -->
            <div
                class="topic-card"
                data-topic="istinja">

                <div class="topic-icon">🧼</div>

                <div
                    class="topic-title"
                    id="topicIstinja">
                </div>

            </div>


            <!-- 5 -->
            <div
                class="topic-card"
                data-topic="purity">

                <div class="topic-icon">👕</div>

                <div
                    class="topic-title"
                    id="topicPurity">
                </div>

            </div>


            <!-- 6 -->
            <div
                class="topic-card"
                data-topic="awrah">

                <div class="topic-icon">🧕</div>

                <div
                    class="topic-title"
                    id="topicAwrah">
                </div>

            </div>


            <!-- 7 -->
            <div
                class="topic-card"
                data-topic="qibla">

                <div class="topic-icon">🧭</div>

                <div
                    class="topic-title"
                    id="topicQibla">
                </div>

            </div>


            <!-- 8 -->
            <div
                class="topic-card"
                data-topic="time">

                <div class="topic-icon">🕐</div>

                <div
                    class="topic-title"
                    id="topicTime">
                </div>

            </div>

        </div>

    </section>


    <!-- ভিতরের বিষয় -->

    <section
        id="topicPage"
        class="topic-page hidden">

        <div class="topic-header">

            <button id="topicBackButton">←</button>

            <span id="topicPageTitle"></span>

        </div>


        <div id="topicContent"></div>

    </section>

</main>


<script src="../js/pobitrota-prostuti.js?v=1"></script>

</body>

</html>
