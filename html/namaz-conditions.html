
<!DOCTYPE html>
<html lang="bn" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta name="theme-color" content="#0F5132">
    <meta
        name="description"
        content="নামাজের আগে প্রয়োজনীয় শর্ত ও প্রস্তুতি সম্পর্কে জানুন।"
    >

    <title>শর্ত ও প্রস্তুতি | IBADAT</title>

    <!-- শর্ত ও প্রস্তুতি পেজের CSS -->
    <link rel="stylesheet" href="../css/namaz-conditions.css">
</head>

<body>

    <main class="conditions-page">

        <!-- হেডার বোর্ড -->
        <header class="hero-board">
            <div class="hero-content">
                <h1 id="pageTitle">শর্ত ও প্রস্তুতি</h1>

                <p id="heroDescription">
                    নামাজের আগে প্রয়োজনীয় বিষয়গুলো জেনে নাও
                </p>
            </div>
        </header>


        <!-- শর্ত ও প্রস্তুতির ১০টি অপশন -->
        <section
            class="conditions-grid"
            aria-label="নামাজের শর্ত ও প্রস্তুতি"
        >

            <!-- ১. ওযু -->
            <a
                class="condition-card"
                data-card-key="wudu"
                href="namaz-purity.html#lesson-wudu"
            >
                <span class="card-image">
                    <img
                        src="../assets/images/wudu.png"
                        alt=""
                    >
                </span>

                <span class="card-title" data-i18n="wudu">
                    ওযু
                </span>
            </a>


            <!-- ২. গোসল -->
            <a
                class="condition-card"
                data-card-key="ghusl"
                href="namaz-purity.html#lesson-ghusl"
            >
                <span class="card-image">
                    <img
                        src="../assets/images/ghusl.png"
                        alt=""
                    >
                </span>

                <span class="card-title" data-i18n="ghusl">
                    গোসল
                </span>
            </a>


            <!-- ৩. শরীরের পবিত্রতা -->
            <a
                class="condition-card"
                data-card-key="body"
                href="namaz-purity.html#lesson-body-purity"
            >
                <span class="card-image">
                    <img
                        src="../assets/images/body-purity.png"
                        alt=""
                    >
                </span>

                <span class="card-title" data-i18n="body">
                    শরীরের পবিত্রতা
                </span>
            </a>


            <!-- ৪. পোশাকের পবিত্রতা -->
            <a
                class="condition-card"
                data-card-key="clothing"
                href="namaz-purity.html#lesson-clothing-purity"
            >
                <span class="card-image">
                    <img
                        src="../assets/images/clothing-purity.png"
                        alt=""
                    >
                </span>

                <span class="card-title" data-i18n="clothing">
                    পোশাকের পবিত্রতা
                </span>
            </a>


            <!-- ৫. স্থানের পবিত্রতা -->
            <a
                class="condition-card"
                data-card-key="place"
                href="namaz-purity.html#lesson-place-purity"
            >
                <span class="card-image">
                    <img
                        src="../assets/images/place-purity.png"
                        alt=""
                    >
                </span>

                <span class="card-title" data-i18n="place">
                    স্থানের পবিত্রতা
                </span>
            </a>


            <!-- ৬. কিবলামুখী হওয়া -->
            <a
                class="condition-card"
                data-card-key="qibla"
                href="qibla-direction.html"
            >
                <span class="card-image">
                    <img
                        src="../assets/images/qibla-direction.png"
                        alt=""
                    >
                </span>

                <span class="card-title" data-i18n="qibla">
                    কিবলামুখী হওয়া
                </span>
            </a>


            <!-- ৭. সতর ঢাকা -->
            <a
                class="condition-card"
                data-card-key="satr"
                href="satr-covering.html"
            >
                <span class="card-image">
                    <img
                        src="../assets/images/satr-covering.png"
                        alt=""
                    >
                </span>

                <span class="card-title" data-i18n="satr">
                    সতর ঢাকা
                </span>
            </a>


            <!-- ৮. নিয়ত -->
            <a
                class="condition-card"
                data-card-key="niyyah"
                href="niyyah.html"
            >
                <span class="card-image">
                    <img
                        src="../assets/images/niyyah.png"
                        alt=""
                    >
                </span>

                <span class="card-title" data-i18n="niyyah">
                    নিয়ত
                </span>
            </a>


            <!-- ৯. নামাজের ওয়াক্ত -->
            <!-- ওয়াক্ত ও রাকাত পেজ তৈরি হলে লিংকটি ঠিক করা হবে -->
            <a
                class="condition-card"
                data-card-key="time"
                href="prayer-time.html"
            >
                <span class="card-image time-card-image">
                    <span class="time-icon" aria-hidden="true">◷</span>
                </span>

                <span class="card-title" data-i18n="time">
                    নামাজের ওয়াক্ত
                </span>
            </a>


            <!-- ১০. বিশেষ পরিস্থিতি -->
            <a
                class="condition-card"
                data-card-key="special"
                href="special-situations.html"
            >
                <span class="card-image">
                    <img
                        src="../assets/images/special-situations.png"
                        alt=""
                    >
                </span>

                <span class="card-title" data-i18n="special">
                    বিশেষ পরিস্থিতি
                </span>
            </a>

        </section>


        <!-- ফুটার বোর্ড -->
        <footer class="footer-board">
            <p id="footerText">
                মনোযোগ দিয়ে ইবাদত করো।
            </p>
        </footer>

    </main>


    <!-- সাইটের বিদ্যমান থিম ব্যবস্থাপনা -->
    <script src="../js/theme.js"></script>

    <!-- শর্ত ও প্রস্তুতি পেজের JavaScript -->
    <script src="../js/namaz-conditions.js"></script>

</body>
</html>
