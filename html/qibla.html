<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0F5132">
  <meta name="description" content="IBADAT Qibla Compass">
  <title>কিবলা কম্পাস | IBADAT</title>

  <link rel="stylesheet" href="../css/qibla.css">
  <script src="../js/qibla.js" defer></script>
</head>

<body>
  <div class="qibla-app" id="qiblaApp">

    <!-- HEADER -->
    <header class="qibla-header">
      <a class="back-button" href="../index.html" aria-label="Back to home">
        <span aria-hidden="true">‹</span>
      </a>

      <h1 id="pageTitle">কিবলা কম্পাস</h1>

      <span class="header-symbol" aria-hidden="true">۞</span>
    </header>

    <!-- MAIN CONTENT BOARD -->
    <main class="qibla-main">

      <section class="content-board">

        <!-- CURRENT LOCATION -->
        <div class="location-board">
          <span class="section-label" id="locationLabel">
            বর্তমান অবস্থান:
          </span>

          <strong id="locationName" aria-live="polite">
            অবস্থান খোঁজা হচ্ছে...
          </strong>

          <button
            class="location-refresh"
            id="refreshLocation"
            type="button"
            aria-label="Refresh location"
            title="Refresh location"
          >
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M20 7v5h-5M4 17v-5h5"/>
              <path d="M5.6 9A7 7 0 0 1 18 6.5L20 12M4 12l2 5.5A7 7 0 0 0 18.4 15"/>
            </svg>
          </button>
        </div>

        <!-- COMPASS AREA -->
        <div class="compass-area">

          <div class="compass-stage" id="compassStage">

            <!-- OUTER COMPASS CIRCLE -->
            <div class="compass-outer">

              <!-- ROTATING DIRECTION DIAL -->
              <div class="compass-dial" id="compassDial">

                <div class="compass-inner-ring"></div>

                <div class="compass-ticks" id="compassTicks"></div>

                <div class="direction-ring" id="directionRing"></div>

              </div>

              <!-- KAABA OUTSIDE THE COMPASS -->
              <div class="qibla-orbit" id="qiblaOrbit">
                <div class="qibla-marker" id="qiblaMarker">
                  <img
                    id="kaabaIcon"
                    src="../assets/icons/kaaba-3d.png"
                    alt="Kaaba"
                    draggable="false"
                  >
                </div>
              </div>

              <!-- ROTATING RED TRIANGLE NEEDLE -->
              <div class="qibla-needle" id="qiblaNeedle">
                <div class="needle-line"></div>
                <div class="needle-tip"></div>
              </div>

              <!-- FIXED CENTER DOT -->
              <div class="compass-center"></div>

            </div>

            <!-- CENTER BEARING -->
            <div class="bearing-display">
              <strong id="bearingValue">---°</strong>
            </div>

          </div>

        </div>

        <!-- DISTANCE -->
        <div class="distance-board">
          <span class="section-label" id="distanceLabel">
            মক্কা থেকে দূরত্ব:
          </span>

          <strong id="distanceValue">---</strong>

          <span id="distanceUnit">কিমি</span>
        </div>

      </section>
    </main>

    <!-- FOOTER -->
    <footer class="qibla-footer">
      <div class="footer-window">
        <div class="footer-track" id="footerMessageTrack">
          <span id="footerMessage">
            আল্লাহর স্মরণেই অন্তর প্রশান্তি লাভ করে।
          </span>

          <span id="footerMessageClone" aria-hidden="true">
            আল্লাহর স্মরণেই অন্তর প্রশান্তি লাভ করে।
          </span>
        </div>
      </div>
    </footer>

  </div>
</body>
</html>
