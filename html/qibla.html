<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0F5132">
  <title>কিবলা কম্পাস | IBADAT</title>
  <link rel="stylesheet" href="../css/qibla.css">
  <script src="../js/qibla.js" defer></script>
</head>

<body data-color-theme="classic">
  <div class="qibla-app">

    <!-- HEADER -->
    <header class="qibla-header board">
      <h1 id="pageTitle">কিবলা কম্পাস</h1>
    </header>

    <!-- MAIN -->
    <main class="qibla-main">

      <!-- LOCATION BOARD -->
      <section class="info-board location-board board" aria-live="polite">
        <span class="info-label" id="locationLabel">বর্তমান অবস্থান</span>
        <strong id="locationName">লোকেশন খোঁজা হচ্ছে...</strong>
      </section>

      <!-- MAIN COMPASS CONTENT BOARD -->
      <section class="compass-content-board board">

        <div class="compass-wrap" id="compassWrap">
          <div class="compass-outer">

            <!-- ROTATING DIAL -->
            <div class="compass-rose" id="compassRose">

              <div class="compass-ticks" id="compassTicks" aria-hidden="true"></div>

              <div class="direction-ring" id="directionRing">
                <span>উ</span>
                <span>উ-উ-পূ</span>
                <span>উ-পূ</span>
                <span>পূ-উ-পূ</span>
                <span>পূ</span>
                <span>পূ-দ-পূ</span>
                <span>দ-পূ</span>
                <span>দ-দ-পূ</span>
                <span>দ</span>
                <span>দ-দ-প</span>
                <span>দ-প</span>
                <span>প-দ-প</span>
                <span>প</span>
                <span>প-উ-প</span>
                <span>উ-প</span>
                <span>উ-উ-প</span>
              </div>

              <!-- KAABA ORBIT MARKER -->
              <div class="qibla-marker" id="qiblaMarker">
                <img
                  src="../assets/icons/kaaba-3d.png"
                  alt="Kaaba"
                  id="kaabaIcon"
                >
              </div>

            </div>

            <!-- FIXED DOUBLE-ENDED NEEDLE -->
            <div class="compass-needle" aria-hidden="true">
              <div class="needle-north"></div>
              <div class="needle-south"></div>
              <div class="needle-center">
                <span></span>
              </div>
            </div>

          </div>
        </div>

        <!-- SENSOR CONTROL -->
        <div class="compass-action">
          <button id="sensorButton" type="button">
            কম্পাস চালু করুন
          </button>
          <p id="sensorMessage" role="status" aria-live="polite"></p>
        </div>

      </section>

      <!-- DISTANCE BOARD -->
      <section class="info-board distance-board board">
        <span class="info-label" id="distanceLabel">কাবা শরিফ পর্যন্ত দূরত্ব</span>
        <strong id="distanceValue">--</strong>
      </section>

    </main>

    <!-- FOOTER -->
    <footer class="qibla-footer board">
      <div class="footer-message-window">
        <div id="footerTrack" class="footer-track">
          <span id="footerMessage"></span>
          <span id="footerMessageClone" aria-hidden="true"></span>
        </div>
      </div>
    </footer>

  </div>
</body>
</html>
