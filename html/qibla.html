
<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#0F5132">
  <meta name="description" content="IBADAT Qibla Compass">
  <title>কিবলা কম্পাস | IBADAT</title>

  <link rel="stylesheet" href="../css/qibla.css">
  <script src="../js/qibla.js" defer></script>
</head>

<body>
  <div class="qibla-app" id="qiblaApp">

    <header class="qibla-header">
      <h1 id="pageTitle">কিবলা কম্পাস</h1>
    </header>

    <main class="qibla-main">
      <section class="content-board" aria-label="Qibla compass">

        <div class="location-board">
          <span class="section-label" id="locationLabel">বর্তমান অবস্থান:</span>
          <strong id="locationName" aria-live="polite">অবস্থান খোঁজা হচ্ছে...</strong>
        </div>

        <div class="compass-area">
          <div class="compass-stage" id="compassStage">

            <div class="compass-outer">

              <div class="compass-dial" id="compassDial">
                <div class="compass-inner-ring"></div>
                <div class="compass-ticks" id="compassTicks"></div>
                <div class="direction-ring" id="directionRing"></div>
              </div>

              <!-- KAABA ORBIT -->
              <div class="qibla-orbit">
                <div class="qibla-marker" id="qiblaMarker">
                  <img
                    id="kaabaIcon"
                    src="../assets/icons/kaaba-3d.png"
                    alt="Kaaba"
                    draggable="false"
                  >
                </div>
              </div>

              <!-- RED TRIANGLE: CIRCULAR PATH AROUND INNER CENTER -->
              <div class="qibla-pointer-orbit" id="qiblaPointerOrbit">
                <div class="qibla-pointer" id="qiblaPointer" aria-hidden="true"></div>
              </div>

            </div>

            <div class="bearing-display">
              <strong id="bearingValue">---°</strong>
              <span id="bearingDirection">---</span>
            </div>

          </div>
        </div>

        <div class="distance-board">

          <div class="distance-details">
            <span class="section-label" id="distanceLabel">
              কাবা শরীফ থেকে দূরত্ব:
            </span>

            <div class="distance-reading">
              <strong id="distanceValue">---</strong>
              <span id="distanceUnit">কিমি</span>
            </div>
          </div>

          <button
            class="compass-toggle"
            id="sensorButton"
            type="button"
            aria-label="Start compass"
            aria-pressed="false"
            title="Start compass"
          >
            <svg class="sensor-icon" viewBox="0 0 24 24" aria-hidden="true">
              <circle cx="12" cy="12" r="9"/>
              <path d="m15.8 8.2-2.4 5.2-5.2 2.4 2.4-5.2 5.2-2.4Z"/>
              <circle cx="12" cy="12" r="1"/>
            </svg>
            <span id="sensorButtonText">চালু</span>
          </button>

          <span id="compassStatus" class="visually-hidden" aria-live="polite">
            কম্পাস বন্ধ আছে
          </span>

        </div>

      </section>
    </main>

    <footer class="qibla-footer">
      <div class="footer-window">
        <div class="footer-track" id="footerMessageTrack">
          <span id="footerMessage">
            আল্লাহর স্মরণেই অন্তর প্রশান্তি লাভ করে।
          </span>
          <span id="footerMessageClone" aria-hidden="true">
            আল্লাহর স্মরণেই অন্তর প্রশান্তি লাভ করে।
          </span>
        </div>
      </div>
    </footer>

  </div>
</body>
</html>
