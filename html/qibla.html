<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#0F5132">
  <meta name="description" content="IBADAT — কিবলা কম্পাস">
  <title>IBADAT | কিবলা কম্পাস</title>

  <link rel="stylesheet" href="../css/qibla.css?v=5">
</head>

<body>
  <main class="qibla-page" id="qiblaApp">

    <header class="hero-board board">
      <h1 id="pageTitle">কিবলা কম্পাস</h1>
    </header>

    <section class="main-board board" aria-label="কিবলা কম্পাস">

      <div class="location-panel">
        <div class="info-block">
          <span id="locationLabel" class="info-label">বর্তমান অবস্থান</span>
          <strong id="locationName" class="info-value">অবস্থান খোঁজা হচ্ছে...</strong>
        </div>

        <div class="info-divider" aria-hidden="true"></div>

        <div class="info-block">
          <span id="distanceLabel" class="info-label">মক্কার দূরত্ব</span>
          <strong id="distance" class="info-value">—</strong>
        </div>
      </div>

      <div class="compass-stage">
        <section class="compass-wrapper" aria-label="Qibla compass">
          <div class="compass" id="compass">

            <div class="compass-dial" id="compassDial">
              <div class="direction n">N</div>
              <div class="direction nne">NNE</div>
              <div class="direction ne">NE</div>
              <div class="direction ene">ENE</div>
              <div class="direction e">E</div>
              <div class="direction ese">ESE</div>
              <div class="direction se">SE</div>
              <div class="direction sse">SSE</div>
              <div class="direction s">S</div>
              <div class="direction ssw">SSW</div>
              <div class="direction sw">SW</div>
              <div class="direction wsw">WSW</div>
              <div class="direction w">W</div>
              <div class="direction wnw">WNW</div>
              <div class="direction nw">NW</div>
              <div class="direction nnw">NNW</div>
            </div>

            <div class="compass-ticks" aria-hidden="true"></div>

            <div class="major-tick tick-n" aria-hidden="true"></div>
            <div class="major-tick tick-ne" aria-hidden="true"></div>
            <div class="major-tick tick-e" aria-hidden="true"></div>
            <div class="major-tick tick-se" aria-hidden="true"></div>
            <div class="major-tick tick-s" aria-hidden="true"></div>
            <div class="major-tick tick-sw" aria-hidden="true"></div>
            <div class="major-tick tick-w" aria-hidden="true"></div>
            <div class="major-tick tick-nw" aria-hidden="true"></div>

            <div class="compass-ring" aria-hidden="true"></div>

            <div class="qibla-needle" id="qiblaNeedle" aria-hidden="true">
              <div class="needle-tip"></div>
            </div>

            <div class="center-point" aria-hidden="true"></div>

            <div class="degree" id="degreeValue">—</div>

            <img
              class="kaaba-marker"
              id="kaabaMarker"
              src="../assets/kaaba-3d.png"
              alt="Kaaba"
              draggable="false"
            >
          </div>
        </section>
      </div>

      <p class="compass-hint" id="compassHint">
        কম্পাস সঠিকভাবে কাজ করতে ডিভাইসটি সমতল রাখুন
      </p>

    </section>

    <footer class="footer-board board">
      <div class="footer-window" aria-live="polite">
        <p id="footerText">সঠিক দিক পেতে কম্পাস ব্যবহার করুন</p>
      </div>
    </footer>

  </main>

  <script src="../js/theme.js"></script>
  <script src="../js/qibla.js?v=5"></script>
</body>
</html>
