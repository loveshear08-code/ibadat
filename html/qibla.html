<!DOCTYPE html>
<html lang="bn">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0,maximum-scale=1.0,
             user-scalable=no">

<title>Qibla</title>

<link rel="stylesheet" href="../css/qibla.css">
</head>

<body>

<div class="qibla-page">

    <!-- HEADER -->
    <div class="topbar">

        <div id="pageTitle">কিবলা</div>

    </div>


    <!-- LOCATION -->
    <div class="location-card">

        <div id="locationLabel">
            বর্তমান অবস্থান
        </div>

        <div id="locationName">
            লোকেশন খোঁজা হচ্ছে...
        </div>

    </div>


    <!-- COMPASS -->
    <div class="compass-section">

        <div class="compass">

            <div class="direction north">N</div>
            <div class="direction east">E</div>
            <div class="direction south">S</div>
            <div class="direction west">W</div>

            <div class="compass-ring">

             <div class="qibla-arrow"
     id="qiblaArrow">

             </div>   

            </div>

            <div class="center-point"></div>

<div class="degree" id="qiblaDegree">
    --°
</div>

</div>

<div class="kaaba-marker" id="kaabaMarker">
    🕋
</div>

    </div>


    <!-- DISTANCE -->
    <div class="info-card">

        <div id="distanceLabel">
            মক্কার দূরত্ব
        </div>

        <div id="distance">
            --
        </div>

    </div>


<script src="../js/qibla.js?v=2"></script>
<script src="../js/theme.js"></script>

</body>
</html>
