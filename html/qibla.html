
<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0F5132">
  <title>কিবলা কম্পাস | IBADAT</title>
  <link rel="stylesheet" href="../css/qibla.css">
  <script src="../js/qibla.js" defer></script>
</head>

<body>
  <div class="qibla-app">

    <!-- HEADER -->
    <header class="qibla-header">
      <div class="header-inner">
        <div class="brand-name">IBADAT</div>
        <h1 id="pageTitle">কিবলা কম্পাস</h1>
      </div>
    </header>

    <!-- MAIN PAGE -->
    <main class="qibla-main">

      <!-- LOCATION BOARD -->
      <section class="info-board location-board" aria-live="polite">
        <span id="locationLabel">বর্তমান অবস্থান</span>
        <strong id="locationName">লোকেশন খোঁজা হচ্ছে...</strong>
      </section>

      <!-- COMPASS CONTENT BOARD -->
      <section class="compass-content-board">

        <div class="compass-wrap" id="compassWrap">

          <div class="compass-outer">

            <!-- ROTATING COMPASS ROSE -->
            <div class="compass-rose" id="compassRose">

              <div class="compass-ticks" id="compassTicks"></div>

              <div class="direction-ring" id="directionRing">
                <span data-direction="0">উ</span>
                <span data-direction="1">উ-উ-পূ</span>
                <span data-direction="2">উ-পূ</span>
                <span data-direction="3">পূ-উ-পূ</span>
                <span data-direction="4">পূ</span>
                <span data-direction="5">পূ-দ-পূ</span>
                <span data-direction="6">দ-পূ</span>
                <span data-direction="7">দ-দ-পূ</span>
                <span data-direction="8">দ</span>
                <span data-direction="9">দ-দ-প</span>
                <span data-direction="10">দ-প</span>
                <span data-direction="11">প-দ-প</span>
                <span data-direction="12">প</span>
                <span data-direction="13">প-উ-প</span>
                <span data-direction="14">উ-প</span>
                <span data-direction="15">উ-উ-প</span>
              </div>

              <!-- QIBLA MARKER AND KAABA -->
              <div class="qibla-marker" id="qiblaMarker">
                <img
                  src="../assets/icons/kaaba-3d.png"
                  alt="Kaaba"
                  id="kaabaIcon"
                >
              </div>

            </div>

            <!-- FIXED NEEDLE -->
            <div class="compass-needle">
              <div class="needle-north"></div>
              <div class="needle-south"></div>
              <div class="needle-center"></div>
            </div>

          </div>
        </div>

        <!-- QIBLA SENSOR ACTION -->
        <div class="compass-action">
          <button id="sensorButton" type="button">
            কম্পাস চালু করুন
          </button>
          <p id="sensorMessage" aria-live="polite"></p>
        </div>

      </section>

      <!-- DISTANCE BOARD -->
      <section class="info-board distance-board">
        <span id="distanceLabel">কাবা শরিফ পর্যন্ত দূরত্ব</span>
        <strong id="distanceValue">--</strong>
      </section>

    </main>

    <!-- FOOTER -->
    <footer class="qibla-footer">
      <div class="footer-message-window">
        <div id="footerTrack" class="footer-track">
          <span id="footerMessage"></span>
          <span id="footerMessageClone" aria-hidden="true"></span>
        </div>
      </div>
    </footer>

  </div>
</body>
</html>
