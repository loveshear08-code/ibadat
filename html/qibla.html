
<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#0F5132">
  <meta name="description" content="IBADAT — কিবলা কম্পাস">
  <title>IBADAT | কিবলা কম্পাস</title>

  <link rel="stylesheet" href="../css/qibla.css?v=6">
</head>

<body>
  <main class="qibla-page" id="qiblaApp">

    <header class="hero-board board">
      <h1 id="pageTitle">কিবলা কম্পাস</h1>
    </header>

    <section class="main-board board" aria-label="কিবলা কম্পাস">

      <div class="location-strip">
        <span id="locationLabel">বর্তমান অবস্থান:</span>
        <strong id="locationName">অবস্থান খোঁজা হচ্ছে...</strong>
      </div>

      <div class="compass-stage">
        <section class="compass-wrapper" aria-label="Qibla compass">
          <div class="compass" id="compass">

            <div class="compass-dial" id="compassDial">
              <div class="direction">উ</div>
              <div class="direction">উ-উপূ</div>
              <div class="direction">উপূ</div>
              <div class="direction">পূ-উপূ</div>
              <div class="direction">পূ</div>
              <div class="direction">পূ-দপূ</div>
              <div class="direction">দপূ</div>
              <div class="direction">দ-দপূ</div>
              <div class="direction">দ</div>
              <div class="direction">দ-দপ</div>
              <div class="direction">দপ</div>
              <div class="direction">প-দপ</div>
              <div class="direction">প</div>
              <div class="direction">প-উপ</div>
              <div class="direction">উপ</div>
              <div class="direction">উ-উপ</div>
            </div>

            <div class="compass-ticks compass-ticks-outer" aria-hidden="true"></div>
            <div class="compass-ticks compass-ticks-inner" aria-hidden="true"></div>
            <div class="compass-major-ticks" id="compassMajorTicks" aria-hidden="true"></div>

            <div class="compass-ring" aria-hidden="true"></div>

            <div class="qibla-needle" id="qiblaNeedle" aria-hidden="true">
              <div class="needle-tip"></div>
            </div>

            <div class="center-point" aria-hidden="true"></div>

            <div class="degree" id="degreeValue">—</div>

            <img
              class="kaaba-marker"
              id="kaabaMarker"
              src="../assets/kaaba-3d.png"
              alt="Kaaba"
              draggable="false"
            >
          </div>
        </section>
      </div>

      <div class="location-strip">
        <span id="distanceLabel">মক্কার দূরত্ব:</span>
        <strong id="distance">—</strong>
      </div>

    </section>

    <footer class="footer-board board">
      <p id="footerText">আল্লাহর স্মরণেই অন্তর প্রশান্তি লাভ করে।</p>
    </footer>

  </main>

  <script src="../js/theme.js"></script>
  <script src="../js/qibla.js?v=6"></script>
</body>
</html>
