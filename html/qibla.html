<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport"
content="width=device-width,initial-scale=1.0">

<title>Qibla</title>

<link rel="stylesheet" href="../css/qibla.css">
</head>

<body>

<div class="qibla-page">

    <div class="topbar">
        <div id="pageTitle">কিবলা</div>
    </div>

    <div class="location-card">

        <div id="locationLabel">
            বর্তমান অবস্থান
        </div>

        <div id="locationName">
            কলকাতা
        </div>

    </div>

    <div class="compass-wrapper">

        <div class="compass-section">

            <div class="compass">

                <div class="direction north">N</div>
                <div class="direction east">E</div>
                <div class="direction south">S</div>
                <div class="direction west">W</div>

                <div class="compass-ring"></div>

                <div class="center-point"></div>

                <div class="degree">
                    278° প
                </div>

            </div>

        </div>

    </div>

    <div class="info-card">

        <div id="distanceLabel">
            মক্কার দূরত্ব
        </div>

        <div id="distance">
            4911 কিমি
        </div>

    </div>

</div>

</body>
</html>
