<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#0F5132">

  <title>নামাজ শিক্ষা | IBADAT</title>

  <link rel="stylesheet" href="../css/namaz.css">
  <script src="../js/namaz.js" defer></script>
</head>

<body>
  <main class="namaz-page">

    <!-- Introduction Board -->
    <section class="intro-board">
      <div class="intro-content">
        <h1 id="intro-title">কী ও কেন?</h1>

        <p id="intro-paragraph-1">
          নামাজ ইসলামের অন্যতম প্রধান ইবাদত। এর মাধ্যমে আমরা
          আল্লাহর স্মরণ করি এবং তাঁর নৈকট্য লাভের চেষ্টা করি।
        </p>

        <p id="intro-paragraph-2">
          সঠিকভাবে নামাজ আদায় করতে হলে পবিত্রতা থেকে শুরু করে
          কিয়াম, কিরাত, রুকু ও সিজদার নিয়ম জানতে হয়।
        </p>

        <div class="intro-divider"></div>
      </div>
    </section>

    <!-- Prayer Learning Options -->
    <section
      class="learning-grid"
      id="learning-grid"
      aria-label="নামাজ শেখার বিষয়সমূহ"
    >

      <button class="learning-card" type="button" data-topic="purity">
        <img src="../assets/purity.png" alt="" class="topic-icon">
        <span data-label="purity">পাক-পবিত্রতা</span>
      </button>

      <button class="learning-card" type="button" data-topic="wudu">
        <img src="../assets/wudu.png" alt="" class="topic-icon">
        <span data-label="wudu">ওজু</span>
      </button>

      <button class="learning-card" type="button" data-topic="conditions">
        <img src="../assets/prayer-conditions.png" alt="" class="topic-icon">
        <span data-label="conditions">নামাজের শর্ত</span>
      </button>

      <button class="learning-card" type="button" data-topic="start">
        <img src="../assets/prayer-start.png" alt="" class="topic-icon">
        <span data-label="start">নামাজ শুরু</span>
      </button>

      <button class="learning-card" type="button" data-topic="qirat">
        <img src="../assets/qirat.png" alt="" class="topic-icon">
        <span data-label="qirat">কিরাত</span>
      </button>

      <button class="learning-card" type="button" data-topic="ruku">
        <img src="../assets/ruku.png" alt="" class="topic-icon">
        <span data-label="ruku">রুকু</span>
      </button>

      <button class="learning-card" type="button" data-topic="sijda">
        <img src="../assets/sijda.png" alt="" class="topic-icon">
        <span data-label="sijda">সিজদা</span>
      </button>

      <button class="learning-card" type="button" data-topic="tashahhud">
        <img src="../assets/tashahhud.png" alt="" class="topic-icon">
        <span data-label="tashahhud">বৈঠক ও দোয়া</span>
      </button>

      <button class="learning-card" type="button" data-topic="salam">
        <img src="../assets/salam-after-prayer.png" alt="" class="topic-icon">
        <span data-label="salam">সালাম ও পরের আমল</span>
      </button>

      <button class="learning-card" type="button" data-topic="times">
        <img src="../assets/prayer-times-rakats.png" alt="" class="topic-icon">
        <span data-label="times">ওয়াক্ত ও রাকাত</span>
      </button>

      <button class="learning-card" type="button" data-topic="mistakes">
        <img src="../assets/prayer-mistakes.png" alt="" class="topic-icon">
        <span data-label="mistakes">ভুল ও সংশোধন</span>
      </button>

      <button class="learning-card" type="button" data-topic="complete">
        <img src="../assets/complete-namaz.png" alt="" class="topic-icon">
        <span data-label="complete">সম্পূর্ণ নামাজ</span>
      </button>

    </section>

  </main>
</body>
</html>
