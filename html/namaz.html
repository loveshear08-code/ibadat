
<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, viewport-fit=cover"
  >
  <meta name="theme-color" content="#1B7F4B" id="themeColorMeta">
  <meta
    name="description"
    content="IBADAT অ্যাপে ধাপে ধাপে নামাজ শেখার সম্পূর্ণ গাইড"
  >

  <title>নামাজ শিক্ষা | IBADAT</title>

  <link rel="stylesheet" href="../css/namaz.css?v=4">
  <script src="../js/namaz.js?v=4" defer></script>
</head>

<body>
  <main class="namaz-page">

  <!-- FIXED HEADER BOARD -->
<header class="top-board" aria-labelledby="page-title">
  <h1 id="page-title">নামাজ শিক্ষা</h1>
</header>

<!-- MAIN CONTENT -->
<section class="namaz-content">

  <!-- MOSQUE BACKGROUND INTRODUCTION BOARD -->
  <section class="intro-board" aria-labelledby="intro-title">
    <h2 id="intro-title">কী ও কেন?</h2>
    <p id="intro-paragraph-1">
      নামাজ ইসলামের অন্যতম প্রধান ইবাদত, যা আল্লাহর স্মরণে
      হৃদয়কে প্রশান্ত করে। এটি মুমিনের জীবনে শৃঙ্খলা আনে
      এবং সৃষ্টিকর্তার নৈকট্য লাভের পথ সুগম করে।
    </p>
  </section>  

      <!-- TEN OPTIONS -->
      <section
        class="learning-grid"
        id="learning-grid"
        aria-label="নামাজ শেখার বিষয়সমূহ"
      >
        <!-- Cards are created by namaz.js -->
      </section>

    </section>

    <!-- FIXED FOOTER BOARD -->
    <footer
      class="namaz-footer bottom-board"
      id="namaz-footer"
      aria-label="নামাজ শিক্ষা পেজের বার্তা"
    >
      <p id="footer-message">
        নামাজ শিখি, শুদ্ধভাবে ইবাদত করি।
      </p>
    </footer>

  </main>

  <!-- Existing shared theme integration -->
  <script src="../js/theme.js"></script>
</body>
</html>
