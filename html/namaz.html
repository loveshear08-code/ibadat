<!DOCTYPE html>

 <section class="intro-board" aria-labelledby="intro-title">

    </p>

    <div class="prayer-rakat-list" id="prayer-rakat-list"
         aria-label="পাঁচ ওয়াক্তের নামাজ ও রাকাত">
      <!-- The list is generated according to the selected language. -->

  </div>
</section>
   

    <section
      class="learning-grid"
      id="learning-grid"
      aria-label="নামাজ শেখার বিষয়সমূহ">
