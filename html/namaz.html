<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, viewport-fit=cover"
  >

  <meta name="theme-color" content="#0F5132">

  <meta
    name="description"
    content="IBADAT অ্যাপে ধাপে ধাপে নামাজ শেখার সম্পূর্ণ গাইড"
  >

  <title>নামাজ শিক্ষা | IBADAT</title>

  <!-- Namaz Page Styles -->
  <link rel="stylesheet" href="../css/namaz.css">

  <!-- Namaz Page Script -->
  <script src="../js/namaz.js" defer></script>
</head>

<body>
  <main class="namaz-page">

    <!-- INTRODUCTION BOARD -->
    <section
      class="intro-board"
      aria-labelledby="intro-title"
    >
      <div class="intro-content">

        <h1 id="intro-title">কী ও কেন?</h1>

        <p id="intro-paragraph-1">
          নামাজ ইসলামের অন্যতম প্রধান ইবাদত, যা আল্লাহর স্মরণে
          হৃদয়কে প্রশান্ত করে। এটি মুমিনের জীবনে শৃঙ্খলা আনে
          এবং সৃষ্টিকর্তার নৈকট্য লাভের পথ সুগম করে।
        </p>

      </div>
    </section>

    <!-- TEN NAMAZ LEARNING OPTIONS -->
    <section
      class="learning-grid"
      id="learning-grid"
      aria-label="নামাজ শেখার বিষয়সমূহ"
    >
      <!-- ১০টি অপশন JavaScript থেকে তৈরি হবে -->
    </section>

    <!-- FOOTER BOARD -->
    <footer
      class="namaz-footer"
      id="namaz-footer"
      aria-label="নামাজ শিক্ষা পেজের বার্তা"
    >
      <p id="footer-message">
        পবিত্রতা রক্ষা করো, ইবাদতে প্রশান্তি খুঁজে নাও।
      </p>
    </footer>

  </main>
</body>
</html>
