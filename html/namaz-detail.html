<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, viewport-fit=cover"
  >

  <meta name="theme-color" content="#0F5132">

  <meta
    name="description"
    content="IBADAT — বাংলা, English ও हिन्दी ভাষায় নামাজ শেখার বিস্তারিত নির্দেশিকা"
  >

  <meta name="color-scheme" content="light dark">

  <title>নামাজ শিক্ষা | IBADAT</title>

  <!-- Namaz detail stylesheet -->
  <link rel="stylesheet" href="../css/namaz-detail.css">

  <!-- Namaz detail JavaScript -->
  <script src="../js/namaz-detail.js" defer></script>
</head>

<body>

  <main class="detail-page">

    <article
      class="lesson-card"
      aria-labelledby="lesson-title"
    >

      <!-- Topic number -->
      <header class="lesson-header">

        <div class="lesson-topline">
          <span
            class="lesson-badge"
            id="lesson-number"
            aria-label="বিষয় নম্বর"
          >
            নামাজ শিক্ষা
          </span>
        </div>

        <!-- Topic title -->
        <h1 id="lesson-title">
          নামাজ শিক্ষা
        </h1>

        <!-- Decorative divider -->
        <div
          class="gold-divider"
          aria-hidden="true"
        ></div>

        <!-- Topic introduction -->
        <p
          class="lesson-intro"
          id="lesson-intro"
        >
          নামাজ শেখার বিস্তারিত নির্দেশিকা।
        </p>

      </header>


      <!--
        Complete lesson content is inserted here
        by namaz-detail.js.

        It can contain:
        - Section headings
        - Explanations and paragraphs
        - Step-by-step instructions
        - Arabic prayer text
        - Pronunciation
        - Meaning and translation
        - Illustrations and sketches
        - Tables and learning notes
      -->

      <section
        class="lesson-content"
        id="lesson-content"
        aria-live="polite"
        aria-busy="true"
        aria-label="নামাজ শিক্ষার বিষয়বস্তু"
      >

        <div class="lesson-loading" role="status">
          <p>বিষয়বস্তু লোড হচ্ছে...</p>
        </div>

      </section>


      <!-- Lesson ending / completion message -->
      <footer
        class="lesson-footer"
        id="lesson-footer"
      ></footer>

    </article>

  </main>

</body>
</html>
