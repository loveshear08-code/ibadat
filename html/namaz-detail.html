<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#0F5132">
  <meta name="description" content="IBADAT — নামাজ শেখার বিস্তারিত নির্দেশিকা">
  <title>নামাজ শিক্ষা | IBADAT</title>

  <link rel="stylesheet" href="../css/namaz-detail.css">
  <script src="../js/namaz-detail.js" defer></script>
</head>

<body>
  <header class="detail-header">
    <button class="back-button" id="back-button" type="button">
      <span class="back-arrow" aria-hidden="true">←</span>
      <span id="back-label">ফিরে যাও</span>

    <div class="brand-name">IBADAT</div>

  <main class="detail-page">
    <section class="lesson-card" aria-labelledby="lesson-title">
      <div class="lesson-topline">
        <span class="lesson-badge" id="lesson-number">নামাজ শিক্ষা</span>

      <h1 id="lesson-title">লোড হচ্ছে...</h1>

      <div class="gold-divider"></div>

      <p class="lesson-intro" id="lesson-intro"></p>

        <p>বিষয়বস্তু লোড হচ্ছে...</p>
      </div>

      <div class="lesson-note" id="lesson-note"></div>
    </section>

    <nav class="lesson-navigation" aria-label="বিষয় পরিবর্তন">
      <button id="previous-button" type="button">
        ← আগের বিষয়

      <button id="next-button" type="button">
