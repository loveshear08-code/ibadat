<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#123d2c">
  <meta name="description" content="IBADAT — আরবি, বাংলা, ইংরেজি ও হিন্দি ভাষায় হাদিস পড়ুন">
  <title>হাদিস সংকলন | IBADAT</title>
  <link rel="stylesheet" href="../css/hadith.css">
</head>
<body>
  <main class="hadith-page" data-screen="books">

    <header class="hadith-header">
      <div class="header-title">
        <h1 id="pageTitle">হাদিস সংকলন</h1>
        <p id="pageSubtitle">হাদিস পড়ুন, শিক্ষা গ্রহণ করুন</p>
      </div>
    </header>

    <section class="hadith-content">

      <!-- প্রথম পৃষ্ঠা: আলাদা কন্টেন্ট বোর্ড নেই -->
      <section class="screen books-screen active" id="booksScreen">
        <div class="section-heading">
          <h2 id="booksHeading">হাদিসের বই</h2>
          <span id="bookCount" class="book-count">৮</span>
        </div>

        <div id="loadingMessage" class="status-message" role="status">
          হাদিসের বই লোড হচ্ছে...
        </div>

        <div id="errorMessage" class="status-message error-message" hidden>
          <p id="errorText">হাদিসের বই লোড করা যায়নি।</p>
          <button type="button" id="retryButton" class="retry-button">
            আবার চেষ্টা করুন
          </button>
        </div>

        <div class="book-grid" id="bookGrid"></div>
      </section>

      <!-- দ্বিতীয় পৃষ্ঠা: হাদিসের তালিকা -->
      <section class="screen list-screen" id="listScreen" hidden>
        <div class="list-toolbar">
          <button type="button" id="backToBooksButton"
                  class="back-button" aria-label="বইয়ের তালিকায় ফিরুন">
            ← <span id="backToBooksText">বইসমূহ</span>
          </button>

          <div class="search-container">
            <span class="search-icon" aria-hidden="true">⌕</span>
            <input
              type="search"
              id="hadithSearch"
              placeholder="হাদিস খুঁজুন..."
              aria-label="হাদিস খুঁজুন"
              autocomplete="off">
          </div>
        </div>

        <div id="listLoadingMessage" class="status-message" role="status" hidden>
          হাদিস লোড হচ্ছে...
        </div>

        <div id="listErrorMessage" class="status-message error-message" hidden>
          <p id="listErrorText">হাদিস লোড করা যায়নি।</p>
          <button type="button" id="listRetryButton" class="retry-button">
            আবার চেষ্টা করুন
          </button>
        </div>

        <div class="hadith-list" id="hadithList"></div>

        <div id="emptySearchMessage" class="status-message" hidden>
          কোনো হাদিস পাওয়া যায়নি।
        </div>
      </section>

      <!-- তৃতীয় পৃষ্ঠা: হাদিসের বিস্তারিত -->
      <section class="screen detail-screen" id="detailScreen" hidden>
        <div class="detail-topbar">
          <button type="button" id="backToListButton" class="back-button">
            ← <span id="backToListText">হাদিসের তালিকা</span>
          </button>
        </div>

        <div class="detail-header-card">
          <p id="detailBookName">হাদিসের বই</p>
          <h2 id="detailHeading">হাদিসের বিবরণ</h2>
          <span id="detailHadithNumber" class="hadith-number">
            হাদিস নম্বর
          </span>
        </div>

        <article class="hadith-detail-card">
          <section class="detail-section">
            <h3 id="arabicHeading">আরবি</h3>
            <p id="arabicText" class="arabic-text" lang="ar" dir="rtl"></p>
          </section>

          <div class="detail-divider"></div>

          <section class="detail-section">
            <h3 id="translationHeading">অনুবাদ</h3>
            <p id="translationText" class="translation-text"></p>
          </section>

          <div class="detail-divider" id="referenceDivider"></div>

          <section class="detail-section reference-section" id="referenceSection">
            <h3 id="referenceHeading">রেফারেন্স</h3>
            <p id="referenceText">—</p>
          </section>
        </article>

        <nav class="hadith-navigation" aria-label="হাদিস নেভিগেশন">
          <button type="button" id="previousHadithButton" class="navigation-button">
            ← <span id="previousText">আগের</span>
          </button>
          <button type="button" id="nextHadithButton" class="navigation-button">
            <span id="nextText">পরের</span> →
          </button>
        </nav>
      </section>

    </section>

    <footer class="hadith-footer">
      <span id="footerText">পড়ুন • চিন্তা করুন • আমল করুন</span>
    </footer>

  </main>

  <script src="../js/hadith.js?v=4"></script>
  <script src="../js/theme.js"></script>
</body>
</html>
