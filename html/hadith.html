
<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0F5132">
  <meta name="color-scheme" content="light dark">

  <title>হাদিস সংকলন | IBADAT</title>

  <link rel="stylesheet" href="../css/hadith.css">

  <script src="../js/theme.js" defer></script>
  <script src="../js/hadith.js" defer></script>
</head>

<body>
  <div class="hadith-app" id="hadithApp" data-screen="books">

    <header class="hadith-header">
      <button
        type="button"
        class="header-back icon-button"
        id="backBooks"
        aria-label="বইয়ের তালিকায় ফিরে যান"
        hidden
      >
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="m15 18-6-6 6-6"></path>
        </svg>
      </button>

      <h1 class="header-title" id="pageTitle">হাদিস সংকলন</h1>

      <button
        type="button"
        class="header-action icon-button"
        id="headerAction"
        aria-label="পুনরায় লোড"
        title="পুনরায় লোড"
      >
        <svg viewBox="0 0 24 24" id="refreshIcon" aria-hidden="true">
          <path d="M20 7v5h-5"></path>
          <path d="M4.9 9a7.5 7.5 0 0 1 12.6-2L20 12"></path>
          <path d="M4 17v-5h5"></path>
          <path d="M19.1 15a7.5 7.5 0 0 1-12.6 2L4 12"></path>
        </svg>
      </button>
    </header>

    <main class="hadith-main">

      <!-- FIRST SCREEN: ONLY EIGHT BOOKS -->
      <section class="books-screen" id="booksScreen" aria-label="হাদিসের বইসমূহ">
        <div class="books-grid" id="booksGrid">

          <button class="book-card" type="button" data-book="bukhari">
            <span class="book-icon" aria-hidden="true">
              <svg viewBox="0 0 24 24">
                <path d="M5 4.5A2.5 2.5 0 0 1 7.5 2H20v17H7.5A2.5 2.5 0 0 0 5 21.5z"></path>
                <path d="M5 4.5v14A2.5 2.5 0 0 1 7.5 16H20"></path>
                <path d="M9 6h7M9 9h7"></path>
              </svg>
            </span>
            <span class="book-name" data-name="bukhari">সহিহ বুখারি</span>
          </button>

          <button class="book-card" type="button" data-book="muslim">
            <span class="book-icon" aria-hidden="true">
              <svg viewBox="0 0 24 24">
                <path d="M5 4.5A2.5 2.5 0 0 1 7.5 2H20v17H7.5A2.5 2.5 0 0 0 5 21.5z"></path>
                <path d="M5 4.5v14A2.5 2.5 0 0 1 7.5 16H20"></path>
                <path d="M9 6h7M9 9h7"></path>
              </svg>
            </span>
            <span class="book-name" data-name="muslim">সহিহ মুসলিম</span>
          </button>

          <button class="book-card" type="button" data-book="abudawud">
            <span class="book-icon" aria-hidden="true">
              <svg viewBox="0 0 24 24">
                <path d="M5 4.5A2.5 2.5 0 0 1 7.5 2H20v17H7.5A2.5 2.5 0 0 0 5 21.5z"></path>
                <path d="M5 4.5v14A2.5 2.5 0 0 1 7.5 16H20"></path>
                <path d="M9 6h7M9 9h7"></path>
              </svg>
            </span>
            <span class="book-name" data-name="abudawud">সুনান আবু দাউদ</span>
          </button>

          <button class="book-card" type="button" data-book="tirmidhi">
            <span class="book-icon" aria-hidden="true">
              <svg viewBox="0 0 24 24">
                <path d="M5 4.5A2.5 2.5 0 0 1 7.5 2H20v17H7.5A2.5 2.5 0 0 0 5 21.5z"></path>
                <path d="M5 4.5v14A2.5 2.5 0 0 1 7.5 16H20"></path>
                <path d="M9 6h7M9 9h7"></path>
              </svg>
            </span>
            <span class="book-name" data-name="tirmidhi">জামে তিরমিজি</span>
          </button>

          <button class="book-card" type="button" data-book="nasai">
            <span class="book-icon" aria-hidden="true">
              <svg viewBox="0 0 24 24">
                <path d="M5 4.5A2.5 2.5 0 0 1 7.5 2H20v17H7.5A2.5 2.5 0 0 0 5 21.5z"></path>
                <path d="M5 4.5v14A2.5 2.5 0 0 1 7.5 16H20"></path>
                <path d="M9 6h7M9 9h7"></path>
              </svg>
            </span>
            <span class="book-name" data-name="nasai">সুনান নাসাঈ</span>
          </button>

          <button class="book-card" type="button" data-book="ibnmajah">
            <span class="book-icon" aria-hidden="true">
              <svg viewBox="0 0 24 24">
                <path d="M5 4.5A2.5 2.5 0 0 1 7.5 2H20v17H7.5A2.5 2.5 0 0 0 5 21.5z"></path>
                <path d="M5 4.5v14A2.5 2.5 0 0 1 7.5 16H20"></path>
                <path d="M9 6h7M9 9h7"></path>
              </svg>
            </span>
            <span class="book-name" data-name="ibnmajah">সুনান ইবনে মাজাহ</span>
          </button>

          <button class="book-card" type="button" data-book="malik">
            <span class="book-icon" aria-hidden="true">
              <svg viewBox="0 0 24 24">
                <path d="M5 4.5A2.5 2.5 0 0 1 7.5 2H20v17H7.5A2.5 2.5 0 0 0 5 21.5z"></path>
                <path d="M5 4.5v14A2.5 2.5 0 0 1 7.5 16H20"></path>
                <path d="M9 6h7M9 9h7"></path>
              </svg>
            </span>
            <span class="book-name" data-name="malik">মুআত্তা ইমাম মালিক</span>
          </button>

          <button class="book-card" type="button" data-book="nawawi">
            <span class="book-icon" aria-hidden="true">
              <svg viewBox="0 0 24 24">
                <path d="M5 4.5A2.5 2.5 0 0 1 7.5 2H20v17H7.5A2.5 2.5 0 0 0 5 21.5z"></path>
                <path d="M5 4.5v14A2.5 2.5 0 0 1 7.5 16H20"></path>
                <path d="M9 6h7M9 9h7"></path>
              </svg>
            </span>
            <span class="book-name" data-name="nawawi">ইমাম নববীর ৪০ হাদিস</span>
          </button>

        </div>
      </section>

      <!-- SECOND SCREEN: ONE SCROLLABLE HADITH BOARD -->
      <section class="list-screen" id="listScreen" hidden>
        <div class="content-board">

          <div class="content-toolbar">
            <div class="content-title-wrap">
              <h2 id="listHeading">হাদিসসমূহ</h2>
              <p id="listSubtitle">আরবি পাঠ ও অনুবাদ</p>
            </div>

            <button
              class="search-toggle icon-button"
              id="searchToggle"
              type="button"
              aria-label="হাদিস খুঁজুন"
              aria-expanded="false"
              aria-controls="searchPanel"
            >
              <svg viewBox="0 0 24 24" aria-hidden="true">
                <circle cx="10.8" cy="10.8" r="6.8"></circle>
                <path d="m16 16 4.5 4.5"></path>
              </svg>
            </button>
          </div>

          <form class="search-panel" id="searchPanel" hidden>
            <input
              id="hadithSearch"
              type="search"
              autocomplete="off"
              aria-label="হাদিস খুঁজুন"
              placeholder="হাদিস খুঁজুন…"
            >
            <button
              class="search-clear icon-button"
              id="clearSearch"
              type="button"
              aria-label="সার্চ মুছুন"
            >
              <svg viewBox="0 0 24 24" aria-hidden="true">
                <path d="m18 6-12 12M6 6l12 12"></path>
              </svg>
            </button>
          </form>

          <div class="list-status" id="listStatus" role="status" aria-live="polite">
            হাদিস লোড হচ্ছে…
          </div>

          <div class="hadith-list" id="hadithList"></div>

          <div class="list-message" id="listMessage" hidden>
            <p id="messageText"></p>
            <button type="button" id="retryButton" class="retry-button">
              আবার চেষ্টা করুন
            </button>
          </div>

          <div class="list-bottom" id="listBottom" hidden>
            <span id="loadedCount"></span>
          </div>

        </div>
      </section>

    </main>

    <footer class="hadith-footer">
      <span class="footer-message" id="footerMessage">
        জ্ঞান অর্জন করুন, আমল করুন
      </span>
    </footer>

  </div>
</body>
</html>
