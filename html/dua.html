
<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>IBADAT - দোয়া</title>

    <link rel="stylesheet" href="../css/dua.css">
</head>

<body>

    <div class="dua-app">

        <!-- Fixed Header Board -->
        <header class="dua-hero">
            <div class="dua-hero-content">
                <h1 id="heroTitle">দোয়া</h1>
                <p id="heroSubtitle">দোয়া শিখুন, পড়ুন ও প্রশান্তি অনুভব করুন</p>
            </div>
        </header>

        <!-- Main Content Board -->
        <main class="dua-main-board">

            <!-- Loading -->
            <div id="loadingBox" class="status-box">
                দোয়া লোড হচ্ছে...
            </div>

            <!-- Error -->
            <div id="errorBox" class="status-box error-box hidden">
                <div id="errorText"></div>
                <button id="retryButton" type="button">
                    আবার চেষ্টা করুন
                </button>
            </div>

            <!-- Collection / Chapter List -->
            <section id="duaHome" class="dua-page hidden">

                <div class="intro-card">
                    <div class="intro-icon">🤲</div>

                    <div id="introTitle" class="intro-title">
                        দোয়া
                    </div>

                    <div id="introText" class="intro-text"></div>
                </div>

                <div id="chapterList" class="chapter-list"></div>

            </section>

            <!-- Entry List -->
            <section id="entryPage" class="dua-page hidden">

                <div class="inner-header">
                    <button
                        id="entryBackButton"
                        type="button"
                        aria-label="Back"
                    >←</button>

                    <span id="entryPageTitle"></span>
                </div>

                <div id="entryList" class="entry-list"></div>

            </section>

            <!-- Single Dua -->
            <section id="duaPage" class="dua-page hidden">

                <div class="inner-header">
                    <button
                        id="duaBackButton"
                        type="button"
                        aria-label="Back"
                    >←</button>

                    <span id="duaPageTitle"></span>
                </div>

                <div id="duaContent"></div>

            </section>

        </main>

        <!-- Fixed Footer Board -->
        <footer class="dua-footer">
            <div class="dua-footer-content">
                <span class="dua-footer-icon">۞</span>
                <p id="footerText">দোয়া — আল্লাহর স্মরণে প্রশান্তি</p>
            </div>
        </footer>

    </div>

    <!-- Audio Player: Created and controlled by dua.js -->
    <script src="../js/dua.js?v=3"></script>

</body>
</html>
