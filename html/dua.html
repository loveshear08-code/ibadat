<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#123d2c">
    <meta name="description" content="IBADAT — বাংলা, English ও हिन्दी ভাষায় দোয়া">
    <title>IBADAT - দোয়া সমূহ</title>

    <link rel="stylesheet" href="../css/dua.css">
    <script src="../js/dua.js" defer></script>
</head>

<body data-color-theme="classic">
    <div class="dua-app">

        <header class="dua-hero board">
            <div class="dua-hero-content">
                <div class="hero-text">
                    <h1 id="heroTitle" class="hero-title">দোয়া সমূহ</h1>
                    <p id="heroSubtitle" class="hero-subtitle">
                        দোয়া শিখুন, পড়ুন ও প্রশান্তি অনুভব করুন
                    </p>
                </div>
            </div>
        </header>

        <main class="dua-main-board board" id="duaMain" aria-live="polite">

            <div id="loadingBox" class="status-box" role="status" aria-live="polite">
                দোয়ার বিভাগ লোড হচ্ছে...
            </div>

            <div id="errorBox" class="status-box error-box hidden" role="alert">
                <div id="errorText"></div>
                <button id="retryButton" type="button">
                    আবার চেষ্টা করুন
                </button>
            </div>

            <!-- প্রথম পেজ: ২০টি মেইন ক্যাটাগরি -->
            <section
                id="duaHome"
                class="dua-page hidden"
                aria-label="দোয়া সমূহের বিভাগ"
            >
                <div id="chapterList" class="chapter-list"></div>
            </section>

            <!-- দ্বিতীয় পেজ: নির্বাচিত ক্যাটাগরির দোয়া -->
            <section
                id="entryPage"
                class="dua-page hidden"
                aria-label="নির্বাচিত বিভাগের দোয়া"
            >
                <div id="entryList" class="entry-list"></div>
            </section>

            <!-- তৃতীয় পেজ: দোয়ার বিস্তারিত -->
            <section
                id="duaPage"
                class="dua-page hidden"
                aria-label="দোয়ার বিস্তারিত"
            >
                <div id="duaContent"></div>
            </section>

        </main>

        <footer class="dua-footer board">
            <div class="dua-footer-content">
                <p id="footerText" class="dua-footer-message">
                    আল্লাহর স্মরণে প্রশান্তি
                </p>
            </div>
        </footer>

    </div>
</body>
</html>
<!-- কপি শেষ ✓ -->
