
<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#0F5132">
  <meta name="description" content="IBADAT — পাক-পবিত্রতা, ওযু, গোসল, তায়াম্মুম ও পরিচ্ছন্নতার শিক্ষামূলক নির্দেশিকা।">
  <title>পাক-পবিত্রতা | IBADAT</title>

  <link rel="stylesheet" href="../css/namaz-purity.css">
  <script src="../js/namaz-purity.js" defer></script>
</head>
<body>

  <main class="purity-page" id="purityPage">

    <!-- উপরের হিরো বোর্ড -->
    <header class="intro-board">
      <div class="intro-content">
        <h1 id="pageTitle">পাক-পবিত্রতা</h1>
        <p id="pageIntro">
          পবিত্রতা শেখো, পরিচ্ছন্ন থাকো এবং ইবাদতের প্রস্তুতি নাও।
        </p>
      </div>
    </header>

    <!-- মাঝখানে ২ কলামে ৮টি অপশন -->
    <section
      class="learning-grid"
      id="learningGrid"
      aria-label="পাক-পবিত্রতার বিষয়সমূহ">
    </section>

    <!-- নিচের ফুটার বোর্ড -->
    <footer class="purity-footer">
      <p id="footerText">
        পবিত্রতা রক্ষা করো, ইবাদতে প্রশান্তি খুঁজে নাও।
      </p>
    </footer>

  </main>

  <!-- অপশন খুললে এই বিস্তারিত অংশ দেখাবে -->
  <section
    class="detail-view"
    id="detailView"
    hidden
    aria-labelledby="detailTitle">

    <header class="detail-header">
      <button
        class="back-button"
        id="backButton"
        type="button">
        <span aria-hidden="true">←</span>
        <span id="backLabel">ফিরে যাও</span>
      </button>

      <h1 id="detailTitle">পবিত্রতা</h1>
    </header>

    <div class="detail-content" id="detailContent"></div>

    <footer class="detail-footer">
      <p id="detailFooterText">
        পবিত্রতা রক্ষা করো, ইবাদতে প্রশান্তি খুঁজে নাও।
      </p>
    </footer>

  </section>

</body>
</html>
