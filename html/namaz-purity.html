
<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#0F5132">
  <meta name="description" content="IBADAT — পাক-পবিত্রতা, ওযু, গোসল, তায়াম্মুম ও পরিচ্ছন্নতার শিক্ষামূলক নির্দেশনা">
  <title>পাক-পবিত্রতা | IBADAT</title>

  <!-- পাক-পবিত্রতা পেজের CSS -->
  <link rel="stylesheet" href="../css/namaz-purity.css">

  <!-- পাক-পবিত্রতা পেজের JavaScript -->
  <script src="../js/namaz-purity.js" defer></script>
</head>

<body>
  <main id="purityPage" class="purity-page">

    <!-- মূল পেজ: হিরো বোর্ড, আটটি অপশন ও ফুটার -->
    <section id="purityHome" class="purity-home">

      <header id="purityHero" class="purity-hero">
        <div class="purity-hero-overlay">
          <h1 id="pageTitle">পাক-পবিত্রতা</h1>
          <p id="pageIntro">
            শুদ্ধতা, পরিচ্ছন্নতা ও ইবাদতের প্রস্তুতি
          </p>
        </div>
      </header>

      <!-- আটটি অপশন JavaScript দিয়ে এখানে তৈরি হবে -->
      <section
        id="learningGrid"
        class="learning-grid"
        aria-label="পাক-পবিত্রতার আটটি বিষয়"
      ></section>

      <footer id="homeFooter" class="purity-footer">
        <p id="footerText">
          পবিত্রতা রক্ষা করো, ইবাদতে প্রশান্তি খুঁজে নাও।
        </p>
      </footer>

    </section>


    <!-- বিস্তারিত শিক্ষা: ওযু, গোসল, তায়াম্মুম ও বাকি বিষয় -->
    <section id="detailView" class="purity-detail" hidden>

      <!-- প্রতিটি বিষয়ের উপরের বার -->
      <header id="detailHeader" class="detail-header">
        <h1 id="detailTitle">ওযু</h1>
        <p id="detailSubtitle"></p>
      </header>

      <!-- কেবল এই অংশটি স্ক্রল করবে -->
      <div id="detailScroll" class="detail-scroll">
        <div
          id="detailContent"
          class="detail-content"
          aria-live="polite"
        ></div>
      </div>

      <!-- প্রতিটি বিস্তারিত পেজের নিচের বার -->
      <footer id="detailFooter" class="purity-footer detail-footer">
        <p id="detailFooterText">
          পবিত্রতা রক্ষা করো, ইবাদতে প্রশান্তি খুঁজে নাও।
        </p>
      </footer>

    </section>

  </main>
</body>
</html>
